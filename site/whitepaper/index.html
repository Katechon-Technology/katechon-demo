<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050608">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/brand/favicon.ico">
  <title>Katechon Whitepaper</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: rgba(5, 8, 10, 0.74);
      --panel-strong: rgba(5, 8, 10, 0.92);
      --line: rgba(255, 255, 255, 0.12);
      --line-hot: rgba(0, 232, 123, 0.58);
      --text: #f2f4f7;
      --muted: rgba(242, 244, 247, 0.58);
      --soft: rgba(242, 244, 247, 0.34);
      --green: #00e87b;
      --cyan: #7de8ff;
      --amber: #ffbf5f;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.66) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.78)),
        url("/wallpaper.jpg") center / cover no-repeat,
        var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.66) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.78)),
        url("/wallpaper.jpg") center / cover no-repeat,
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(90deg, transparent, black 18%, black 84%, transparent);
      opacity: 0.82;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 8px
        );
      mix-blend-mode: screen;
      opacity: 0.24;
    }

    .chrome {
      position: fixed;
      inset: 18px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .chrome::before,
    .chrome::after {
      content: "";
      position: absolute;
      width: 116px;
      height: 1px;
      background: var(--line-hot);
      box-shadow: 0 0 24px rgba(0, 232, 123, 0.32);
    }

    .chrome::before {
      top: -1px;
      left: 28px;
    }

    .chrome::after {
      right: 28px;
      bottom: -1px;
    }

    .gate {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 40px;
    }

    .access {
      align-self: center;
      width: min(100%, 760px);
      padding: 0;
    }

    .signal {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--cyan);
      font: 11px/1.2 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 18px rgba(0, 232, 123, 0.8);
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: 86px;
      line-height: 0.92;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      color: var(--text);
    }

    h1 small {
      display: block;
      margin-top: 8px;
      color: transparent;
      -webkit-text-stroke: 1px rgba(242, 244, 247, 0.72);
      font: inherit;
    }

    .thesis {
      max-width: 460px;
      margin: 26px 0 42px;
      color: rgba(242, 244, 247, 0.74);
      font-size: 18px;
      line-height: 1.45;
    }

    .access-line {
      width: min(100%, 520px);
      min-height: 58px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
    }

    .prompt {
      color: var(--green);
      font: 16px/1 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    input,
    button {
      min-height: 42px;
      border-radius: 6px;
      font: inherit;
      letter-spacing: 0;
    }

    input {
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 16px;
    }

    input::placeholder {
      color: var(--soft);
    }

    button {
      border: 1px solid rgba(0, 232, 123, 0.42);
      padding: 0 18px;
      background: rgba(0, 232, 123, 0.08);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      outline: none;
      border-color: var(--green);
      background: rgba(0, 232, 123, 0.14);
      box-shadow: 0 0 28px rgba(0, 232, 123, 0.18);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.64;
    }

    .status {
      min-height: 22px;
      margin: 14px 0 0 16px;
      color: var(--muted);
      font: 11px/1.45 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .status[data-error="true"] {
      color: #ff7c68;
    }

    .footline {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: rgba(242, 244, 247, 0.42);
      font: 10px/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .chrome {
        inset: 10px;
      }

      .gate {
        min-height: 100vh;
        padding: 26px;
      }

      h1 {
        font-size: 52px;
      }

      .thesis {
        max-width: 330px;
        margin-bottom: 30px;
        font-size: 16px;
      }

      .access-line {
        grid-template-columns: auto minmax(0, 1fr);
      }

      button {
        grid-column: 1 / -1;
        width: 100%;
      }

      .footline {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="chrome" aria-hidden="true"></div>
  <main class="gate">
    <section class="access" aria-labelledby="page-title">
      <p class="signal"><span class="dot"></span>Restricted signal</p>
      <h1 id="page-title"><span>Katechon</span><small>Whitepaper</small></h1>
      <p class="thesis">From inference to real time content.</p>
      <form id="whitepaper-form" class="access-line" autocomplete="off">
        <label class="sr-only" for="password">Access key</label>
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="password" name="password" type="password" placeholder="access key" required autofocus>
        <button type="submit">Enter</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
    <div class="footline" aria-hidden="true">
      <span>Compute / state / channel</span>
      <span>Zero latency surface</span>
    </div>
  </main>
  <script>
    const form = document.getElementById("whitepaper-form");
    const input = document.getElementById("password");
    const statusLine = document.getElementById("status");
    const submitButton = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      statusLine.dataset.error = "false";
      statusLine.textContent = "checking signal";

      try {
        const response = await fetch("/api/whitepaper-auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: input.value })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.ok || !result.href) {
          throw new Error("Invalid password");
        }

        statusLine.textContent = "access granted";
        window.location.assign(result.href);
      } catch (error) {
        statusLine.dataset.error = "true";
        statusLine.textContent = "signal rejected";
        input.select();
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
