<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050608">
  <title>Katechon Technology</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: #050608;
      color: #f4f4f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 9vw, 8rem);
      font-weight: 650;
      line-height: 0.96;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Katechon Technology</h1>
</body>
</html>
