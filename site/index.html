<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050608">
  <title>Katechon Technology</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/brand/site.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #111111;
      --accent: #e04a2f;
      --accent-glow: rgba(224, 74, 47, 0.15);
      --accent-soft: rgba(224, 74, 47, 0.08);
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .landing {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 60%, var(--accent-soft) 0%, var(--bg) 70%);
    }

    h1 {
      font-size: clamp(4rem, 9vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1.05;
    }

    .hero-mark {
      width: clamp(72px, 8vw, 104px);
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 30px rgba(224, 74, 47, 0.14));
    }

    .subtitle {
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      color: var(--text-muted);
      margin-top: 2.5rem;
      letter-spacing: 0.25em;
      font-weight: 300;
    }

    .cta {
      margin-top: 5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.2rem 3rem;
      border: 1px solid rgba(224, 74, 47, 0.4);
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: inherit;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cta:hover {
      background: rgba(224, 74, 47, 0.15);
      border-color: rgba(224, 74, 47, 0.6);
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .cta .arrow {
      font-size: 1.3em;
      transition: transform 0.3s ease;
    }

    .cta:hover .arrow {
      transform: translateX(4px);
    }

    .actions {
      margin-top: 5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .actions .cta {
      margin-top: 0;
    }

    .cta.secondary {
      color: var(--text-muted);
      border-color: var(--border);
      background: rgba(255,255,255,0.03);
    }

    .cta.secondary:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="landing">
    <img class="hero-mark" src="/brand/katechon-mark.svg" alt="Katechon">
    <h1>KATECHON<br>TECHNOLOGY</h1>
    <div class="subtitle">REAL-TIME CONTENT GENERATION</div>
    <div class="actions">
      <a class="cta" href="/app/">Enter App <span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="cta secondary" href="/data/">Data Room <span class="arrow" aria-hidden="true">&rarr;</span></a>
    </div>
  </div>
</body>
</html>
