<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katechon Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <style>
    :root {
      --bg0: #040609;
      --bg1: #0d1117;
      --panel: rgba(8, 12, 16, 0.76);
      --panel-strong: rgba(7, 10, 14, 0.92);
      --line: rgba(255,255,255,0.12);
      --line-hot: rgba(255,255,255,0.30);
      --text: #f3f6f8;
      --muted: rgba(243,246,248,0.66);
      --soft: rgba(243,246,248,0.42);
      --accent: #00e87b;
      --accent2: #7de8ff;
      --accent3: #ffbf5f;
      --danger: #ff625f;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    body {
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 14% 9%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 28%),
        radial-gradient(circle at 84% 16%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 26%),
        radial-gradient(circle at 50% 110%, color-mix(in srgb, var(--accent3) 12%, transparent), transparent 34%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 58%, #030405);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, black, transparent 82%);
      pointer-events: none;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.055);
      cursor: pointer;
    }
    button:hover,
    button:focus-visible,
    button.active {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 66%, white);
      background: color-mix(in srgb, var(--accent) 15%, rgba(255,255,255,0.04));
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      min-height: 570px;
      padding: 15px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }

    .topbar,
    .module,
    .metric,
    .scene-card,
    .feed-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 58px rgba(0,0,0,0.30);
      backdrop-filter: blur(12px);
    }

    .topbar {
      min-height: 78px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      padding: 16px 18px;
      overflow: hidden;
    }
    .kicker,
    .section-label,
    .metric-label,
    .metric-note,
    .feed-time,
    .chip,
    .source-label,
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .kicker {
      color: var(--accent2);
      font-size: 10px;
      margin-bottom: 7px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 0.98;
      letter-spacing: 0;
      max-width: 900px;
    }
    .workspace {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.52fr) minmax(306px, 0.62fr);
      gap: 12px;
    }
    .main {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      min-height: 88px;
      padding: 14px;
      overflow: hidden;
      position: relative;
    }
    .metric::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
      opacity: 0.58;
      transform-origin: left center;
    }
    .metric-label {
      color: var(--soft);
      font-size: 9px;
      margin-bottom: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-value {
      font-size: 28px;
      line-height: 1;
      font-weight: 780;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-wrap {
      min-height: 0;
      min-width: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      overflow: hidden;
    }
    .section-head {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .section-head > div {
      min-width: 0;
    }
    .section-label {
      color: var(--accent);
      font-size: 10px;
    }
    .section-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      max-width: 720px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .chip {
      flex-shrink: 0;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      color: rgba(243,246,248,0.62);
      font-size: 9px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 5px;
      background: rgba(0,0,0,0.22);
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage {
      position: relative;
      min-height: 0;
      min-width: 0;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px),
        rgba(0,0,0,0.25);
      background-size: 34px 34px;
      isolation: isolate;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 12%, transparent 88%, rgba(0,0,0,0.24));
      mix-blend-mode: screen;
    }
    .texture-video {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.24;
      filter: saturate(1.35) contrast(1.12);
    }
    .asset-plane {
      position: absolute;
      inset: 0;
      z-index: -3;
      background-image: var(--asset);
      background-size: cover;
      background-position: center;
      opacity: 0.27;
      filter: saturate(1.18) contrast(1.08);
    }
    .scene {
      position: absolute;
      inset: 14px;
      z-index: 1;
    }
    .scene-grid {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 36%),
        radial-gradient(circle at 20% 26%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 22%),
        radial-gradient(circle at 80% 68%, color-mix(in srgb, var(--accent3) 10%, transparent), transparent 24%);
      opacity: 0.78;
    }
    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      top: 0;
      background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent);
      opacity: 0.72;
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent2) 45%, transparent);
    }
    .node {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      transform-origin: left center;
      opacity: 0.72;
    }
    .map-halo,
    .sensor-ping,
    .anomaly-core {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .map-halo {
      left: 34%;
      top: 34%;
      width: 30%;
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--accent2) 30%, white);
      box-shadow: 0 0 42px color-mix(in srgb, var(--accent2) 16%, transparent), inset 0 0 34px rgba(255,255,255,0.04);
    }
    .route-arc,
    .orbital-sweep,
    .dark-vector {
      position: absolute;
      height: 1px;
      transform-origin: left center;
      pointer-events: none;
    }
    .route-arc {
      left: 12%;
      width: 54%;
      border-top: 1px solid color-mix(in srgb, var(--accent3) 46%, white);
      border-radius: 50%;
      opacity: 0.74;
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent3) 24%, transparent);
    }
    .arc-a { top: 31%; rotate: 12deg; }
    .arc-b { top: 60%; rotate: -17deg; }
    .orbital-sweep {
      left: -8%;
      top: 45%;
      width: 116%;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent2) 72%, white), transparent);
      opacity: 0.64;
      rotate: -10deg;
    }

    .rail {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
    }
    .rail.has-generated {
      grid-template-rows: minmax(0, 1fr) auto auto;
    }
    .feed {
      min-height: 0;
      min-width: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      overflow: hidden;
    }
    .feed-list {
      min-height: 0;
      overflow: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }
    .feed-item {
      margin-bottom: 8px;
      padding: 11px;
      cursor: pointer;
      box-shadow: none;
      background: rgba(0,0,0,0.22);
      transition: border-color 120ms ease, background 120ms ease;
    }
    .feed-item.active,
    .feed-item:hover {
      border-color: color-mix(in srgb, var(--accent) 58%, white);
      background: color-mix(in srgb, var(--accent) 10%, rgba(0,0,0,0.30));
    }
    .feed-time {
      color: var(--soft);
      font-size: 9px;
      margin-bottom: 6px;
    }
    .feed-title {
      font-size: 13px;
      line-height: 1.28;
      color: rgba(243,246,248,0.88);
      overflow-wrap: anywhere;
    }
    .feed-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .generated-stack {
      min-width: 0;
      max-height: 330px;
      padding: 12px;
      display: grid;
      gap: 8px;
      overflow: auto;
    }
    .generated-stack.hidden,
    .generated-stage:empty {
      display: none;
    }
    .generated-stage {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 6;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
      gap: 8px;
      pointer-events: none;
    }
    .generated-component {
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--accent) 34%, rgba(255,255,255,0.12));
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel-strong) 90%, var(--accent) 10%);
      box-shadow: 0 14px 42px rgba(0,0,0,0.28);
      padding: 10px;
      overflow: hidden;
      pointer-events: auto;
    }
    .generated-stage .generated-component {
      background: rgba(4, 7, 10, 0.78);
      backdrop-filter: blur(14px);
    }
    .generated-eyebrow,
    .generated-note,
    .generated-row-k,
    .generated-metric-note {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }
    .generated-eyebrow {
      color: var(--accent2);
      font-size: 9px;
      margin-bottom: 7px;
    }
    .generated-title {
      font-size: 14px;
      line-height: 1.15;
      font-weight: 760;
      color: rgba(243,246,248,0.94);
      overflow-wrap: anywhere;
    }
    .generated-body,
    .generated-item,
    .generated-row-v {
      color: rgba(243,246,248,0.76);
      font-size: 12px;
      line-height: 1.34;
      overflow-wrap: anywhere;
    }
    .generated-body {
      margin-top: 7px;
    }
    .generated-list,
    .generated-rows,
    .generated-metrics {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .generated-item,
    .generated-row,
    .generated-metric {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background: rgba(0,0,0,0.20);
      padding: 7px;
    }
    .generated-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }
    .generated-row-k {
      color: var(--soft);
      font-size: 8px;
    }
    .generated-row-m {
      grid-column: 2;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
      margin-top: 2px;
    }
    .generated-metrics {
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    }
    .generated-metric-value {
      font-size: 18px;
      font-weight: 760;
      line-height: 1;
      margin: 4px 0;
    }
    .generated-note {
      margin-top: 8px;
      color: var(--soft);
      font-size: 8px;
      line-height: 1.35;
    }
    .generated-vega-chart {
      min-height: 232px;
    }
    .generated-stage .generated-vega-chart {
      min-height: 210px;
    }
    .generated-chart-shell {
      width: 100%;
      height: 176px;
      margin-top: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        rgba(0,0,0,0.18);
      background-size: 24px 24px;
      overflow: hidden;
    }
    .generated-stage .generated-chart-shell {
      height: 146px;
    }
    .generated-chart {
      width: 100%;
      height: 100%;
      min-height: 118px;
    }
    .generated-chart canvas,
    .generated-chart svg {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .generated-chart-fallback {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      align-items: end;
      padding: 12px;
    }
    .generated-chart-fallback span {
      min-height: 10%;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent2) 42%, transparent));
      opacity: 0.72;
    }

    .insight-panel {
      min-width: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(118px, 1fr) auto;
      gap: 10px;
      overflow: hidden;
    }
    .mini-visual {
      position: relative;
      min-height: 128px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px),
        radial-gradient(circle at 28% 28%, color-mix(in srgb, var(--accent2) 15%, transparent), transparent 34%),
        rgba(0,0,0,0.26);
      background-size: 24px 24px, 24px 24px, auto, auto;
      overflow: hidden;
    }
    .mini-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 32%, rgba(0,0,0,0.16));
    }
    .mini-focus {
      min-height: 54px;
      display: grid;
      align-content: center;
      gap: 6px;
      color: rgba(243,246,248,0.82);
      font-size: 12px;
      line-height: 1.35;
      overflow: hidden;
    }
    .mini-focus .source-label,
    .mini-focus-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-bars,
    .mini-depth,
    .mini-stack {
      position: absolute;
      inset: 16px;
      display: grid;
      align-items: end;
      gap: 5px;
    }
    .mini-bars {
      grid-template-columns: repeat(14, 1fr);
    }
    .mini-depth {
      inset: auto 16px 16px 16px;
      height: 34px;
      align-items: stretch;
      grid-template-rows: repeat(3, 1fr);
    }
    .mini-stack {
      align-items: stretch;
      grid-template-rows: repeat(4, 1fr);
    }
    .mini-bar,
    .mini-depth-row,
    .mini-signal-row {
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), rgba(255,255,255,0.08));
    }
    .mini-depth-row:nth-child(even),
    .mini-bar.down {
      background: linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--accent3) 32%, transparent), rgba(255,255,255,0.06));
    }
    .mini-line-chart {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 22%;
      height: 36%;
      border-top: 2px solid var(--accent2);
      border-right: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      border-radius: 50% 42% 0 0;
      transform: skewX(-14deg);
      box-shadow: 0 -12px 26px color-mix(in srgb, var(--accent2) 16%, transparent);
    }
    .mini-prob-ring,
    .mini-orbit {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 68%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--accent2) 36%, white);
      transform: translate(-50%, -50%);
    }
    .mini-prob-ring:nth-child(2),
    .mini-orbit:nth-child(2) {
      width: 44%;
      border-color: color-mix(in srgb, var(--accent) 38%, white);
      transform: translate(-50%, -50%) rotate(58deg);
    }
    .mini-prob-label {
      position: absolute;
      right: 16px;
      bottom: 14px;
      color: var(--accent);
      font-size: 26px;
      font-weight: 780;
    }
    .mini-map-node,
    .mini-dot,
    .mini-star,
    .mini-qbit,
    .mini-person {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 56%, transparent);
    }
    .mini-map-node,
    .mini-dot,
    .mini-qbit {
      width: 8px;
      height: 8px;
    }
    .mini-person {
      width: 7px;
      height: 7px;
      background: var(--accent2);
    }
    .mini-star {
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.84);
      box-shadow: 0 0 8px rgba(255,255,255,0.62);
    }
    .mini-map-line,
    .mini-link {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      transform-origin: left center;
      opacity: 0.72;
    }
    .mini-gauge {
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 14px;
      height: 54px;
      border-top: 2px solid color-mix(in srgb, var(--accent) 58%, white);
      border-radius: 90px 90px 0 0;
    }
    .mini-gauge::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 42%;
      height: 2px;
      background: var(--accent3);
      transform: rotate(-18deg);
      transform-origin: left center;
    }
    .mini-dna {
      position: absolute;
      inset: 16px 20px;
      border-left: 1px solid color-mix(in srgb, var(--accent2) 45%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      transform: skewY(-8deg);
    }
    .mini-dna span {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent2), var(--accent), transparent);
    }
    .mini-wave {
      position: absolute;
      left: -8%;
      right: -8%;
      height: 42px;
      border-top: 1px solid color-mix(in srgb, var(--accent2) 34%, white);
      border-radius: 50%;
    }
    .mini-vent {
      position: absolute;
      bottom: 14px;
      width: 22px;
      border-radius: 14px 14px 4px 4px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent3) 42%, transparent), rgba(0,0,0,0.35));
      box-shadow: 0 -18px 34px color-mix(in srgb, var(--accent3) 18%, transparent);
    }
    .mini-silence {
      position: absolute;
      left: 12%;

      opacity: 0.58;
    }
    .vent {
      position: absolute;
      width: 34px;
      height: 92px;
      bottom: 6%;
      border-radius: 20px 20px 4px 4px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent3) 45%, transparent), rgba(0,0,0,0.28));
      box-shadow: 0 -22px 42px color-mix(in srgb, var(--accent3) 22%, transparent);
    }

    .gridops .grid-node {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid color-mix(in srgb, var(--accent) 58%, white);
      border-radius: 4px;
      background: rgba(0,0,0,0.36);
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .grid-backbone {
      position: absolute;
      left: 5%;
      right: 34%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
      opacity: 0.72;
      transform-origin: left center;
    }
    .backbone-a { top: 37%; rotate: 12deg; }
    .backbone-b { top: 61%; rotate: -9deg; }
    .power-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
      transform-origin: left center;
    }

    .outbreak-core {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at center, color-mix(in srgb, var(--danger) 46%, transparent), transparent 66%);
      border: 1px solid color-mix(in srgb, var(--danger) 34%, white);
      box-shadow: 0 0 34px color-mix(in srgb, var(--danger) 24%, transparent);
      opacity: 0.74;
    }
    .core-a { left: 18%; top: 22%; }
    .core-b { left: 56%; top: 32%; }
    .core-c { left: 38%; top: 62%; }
    .viralnet .person {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent2) 56%, transparent);
    }
    .scenario-curve {
      position: absolute;
      left: 7%;
      right: 7%;
      height: 34%;
      border-top: 2px solid var(--accent);
      border-radius: 50%;
    }

    .darkwatch .catalog-cell {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.34);
    }
    .anomaly-core {
      left: 18%;
      top: 29%;
      width: 96px;
      height: 96px;
      border: 1px solid color-mix(in srgb, var(--accent3) 38%, white);
      background: radial-gradient(circle at center, color-mix(in srgb, var(--accent3) 22%, transparent), transparent 68%);
      box-shadow: 0 0 38px color-mix(in srgb, var(--accent3) 22%, transparent);
      opacity: 0.72;
    }
    .dark-vector {
      left: 18%;
      width: 48%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent3) 52%, transparent), var(--accent2), transparent);
      opacity: 0.48;
    }
    .vector-a { top: 44%; rotate: 12deg; }
    .vector-b { top: 58%; rotate: -7deg; }
    .silence-window {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 9%;
      height: 72px;
      border: 1px solid color-mix(in srgb, var(--accent3) 25%, white);
      border-radius: 7px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.035), transparent);
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      html, body { height: auto; min-height: 100%; }
      .app { height: auto; min-height: 100vh; }
      .topbar,
      .workspace,
      .newsroom,
      .market-mesh,
      .arena-scene,
      .orderbook,
      .prediction,
      .bio-lab,
      .meme-scene {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 32px; }
      .metrics { grid-template-columns: 1fr; }
      .stage { min-height: 520px; }
      .rail { grid-template-rows: auto auto; }
      .feed-list { max-height: 380px; }
      .insight-panel { min-height: 250px; }
      .side-stack,
      .geo-signal .side-stack,
      .gridops .side-stack {
        left: calc(100vw - 190px);
        right: auto;
        top: 18%;
        bottom: 12px;
        width: 132px;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }
      .quantum-stack {
        left: calc(100vw - 190px);
        right: auto;
        top: 18%;
        bottom: 12px;
        width: 132px;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }
      .side-stack .scene-card,
      .quantum-stack .scene-card {
        padding: 8px;
        gap: 5px;
      }
      .side-stack .scene-card > span:not(.source-label),
      .quantum-stack .scene-card > span:not(.source-label) {
        display: none;
      }
      .side-stack .scene-card > strong,
      .quantum-stack .scene-card > strong {
        font-size: 18px;
        line-height: 1;
      }
      .quantum-shelf {
        right: 48%;
        bottom: 12%;
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="kicker"><span class="live-dot"></span><span id="kicker"></span></div>
        <h1 id="title"></h1>
      </div>
    </header>

    <section class="workspace">
      <div class="main">
        <section class="metrics" id="metrics"></section>
        <section class="module stage-wrap">
          <div class="section-head">
            <div>
              <div class="section-label" id="visual-label"></div>
              <div class="section-copy" id="visual-copy"></div>
            </div>
            <span class="chip" id="source-chip">synthetic state</span>
          </div>
          <div class="stage" id="stage"></div>
        </section>
      </div>
      <aside class="rail">
        <section class="module feed">
          <div class="section-head">
            <div class="section-label" id="feed-label"></div>
            <span class="chip" id="clock"></span>
          </div>
          <div class="feed-list" id="feed"></div>
        </section>
        <section class="module generated-stack hidden" id="generated-rail"></section>
        <section class="module insight-panel">
          <div class="section-head">
            <div class="section-label" id="mini-label"></div>
            <span class="chip" id="mini-chip"></span>
          </div>
          <div class="mini-visual" id="mini-visual"></div>
          <div class="mini-focus">
            <div class="source-label">current focus</div>
            <div class="mini-focus-text" id="mini-focus"></div>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <script src="/dashboards/catalog.js"></script>
  <script src="/dashboards/prototype.js"></script>
</body>
</html>
