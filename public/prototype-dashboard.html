<!DOCTYPE html>
<html class="blank-dashboard-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katechon Dashboard</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/brand/site.webmanifest">
  <script defer src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <style>
    :root {
      --bg0: #040609;
      --bg1: #0d1117;
      --panel: rgba(8, 12, 16, 0.76);
      --panel-strong: rgba(7, 10, 14, 0.92);
      --line: rgba(255,255,255,0.12);
      --line-hot: rgba(255,255,255,0.30);
      --text: #f3f6f8;
      --muted: rgba(243,246,248,0.66);
      --soft: rgba(243,246,248,0.42);
      --accent: #00e87b;
      --accent2: #7de8ff;
      --accent3: #ffbf5f;
      --danger: #ff625f;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    body {
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 14% 9%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 28%),
        radial-gradient(circle at 84% 16%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 26%),
        radial-gradient(circle at 50% 110%, color-mix(in srgb, var(--accent3) 12%, transparent), transparent 34%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 58%, #030405);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, black, transparent 82%);
      pointer-events: none;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.055);
      cursor: pointer;
    }
    button:hover,
    button:focus-visible,
    button.active {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 66%, white);
      background: color-mix(in srgb, var(--accent) 15%, rgba(255,255,255,0.04));
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      min-height: 570px;
      padding: 15px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }
    body.generated-page-active .app {
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar,
    .module,
    .metric,
    .scene-card,
    .feed-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 58px rgba(0,0,0,0.30);
      backdrop-filter: blur(12px);
    }

    .topbar {
      min-height: 78px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);
      align-items: center;
      gap: 18px;
      padding: 16px 18px;
      overflow: hidden;
    }
    .command-panel[hidden] {
      display: none;
    }
    .command-panel {
      min-width: 0;
      display: grid;
      gap: 8px;
    }
    .prompt-strip {
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: none;
    }
    .prompt-strip::-webkit-scrollbar {
      display: none;
    }
    .prompt-chip {
      flex: 0 0 auto;
      max-width: 220px;
      min-height: 28px;
      padding: 0 9px;
      color: rgba(243,246,248,0.76);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .command-row {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }
    .command-action {
      min-width: 62px;
      min-height: 34px;
      padding: 0 11px;
      font-size: 11px;
      font-weight: 720;
    }
    .command-status {
      min-height: 14px;
      color: var(--soft);
      font: 9px/1.3 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kicker,
    .section-label,
    .metric-label,
    .metric-note,
    .feed-time,
    .chip,
    .source-label,
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .kicker {
      color: var(--accent2);
      font-size: 10px;
      margin-bottom: 7px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 0.98;
      letter-spacing: 0;
      max-width: 900px;
    }
    .channel-command {
      margin-top: 14px;
      display: grid;
      gap: 8px;
      max-width: 920px;
    }
    .prompt-strip {
      display: flex;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .prompt-pill,
    .share-state,
    .command-submit {
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      line-height: 1.1;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .command-status {
      min-height: 15px;
      color: var(--muted);
      font: 10px/1.2 "SFMono-Regular", Consolas, monospace;
      text-transform: uppercase;
    }
    .share-state {
      border-color: color-mix(in srgb, var(--accent2) 40%, white);
    }
    body.share-replay-active .command-panel,
    body.share-replay-active .channel-command,
    body.replay-stage .generated-stage,
    body.replay-stage .generated-page-stage,
    body.replay-provenance .generated-source,
    body.replay-provenance .generated-page-source,
    body.replay-next .generated-action-panel,
    body.replay-next .generated-page-actions {
      outline: 2px solid color-mix(in srgb, var(--accent) 62%, white);
      box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 24%, transparent);
      animation: replayPulse 1.25s ease-in-out infinite;
    }
    @keyframes replayPulse {
      0%, 100% { outline-offset: 0; }
      50% { outline-offset: 4px; }
    }
    .workspace {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.52fr) minmax(306px, 0.62fr);
      gap: 12px;
    }
    .generated-page[hidden] {
      display: none;
    }
    body.generated-page-active .workspace {
      grid-template-columns: minmax(0, 1fr);
    }
    body.generated-page-active .main,
    body.generated-page-active .rail {
      display: none;
    }
    body.generated-page-active .action-rail,
    body.generated-page-active .topbar-meta {
      display: none;
    }
    body.generated-page-active .topbar {
      grid-template-columns: minmax(280px, 0.72fr) minmax(360px, 1fr);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 42%),
        rgba(7, 10, 14, 0.84);
    }
    .pitch-morph[hidden] {
      display: none;
    }
    body.pitch-morph-active .workspace {
      grid-template-columns: minmax(0, 1fr);
    }
    body.pitch-morph-active .generated-breadcrumb,
    body.pitch-morph-active .generated-page,
    body.pitch-morph-active .main,
    body.pitch-morph-active .rail,
    body.pitch-morph-active .action-rail,
    body.pitch-morph-active .topbar-meta {
      display: none;
    }
    body.pitch-morph-active .topbar {
      grid-template-columns: minmax(260px, 1fr) minmax(250px, 0.44fr);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent 45%),
        linear-gradient(90deg, rgba(8,12,16,0.92), rgba(8,12,16,0.74));
    }
    .pitch-morph {
      grid-column: 1 / -1;
      min-width: 0;
      min-height: 0;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, rgba(255,255,255,0.09));
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 74% 46%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
        rgba(5, 8, 10, 0.78);
      box-shadow: 0 22px 76px rgba(0,0,0,0.36);
      backdrop-filter: blur(14px);
    }
    .pitch-frame {
      position: relative;
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(300px, 0.72fr) minmax(390px, 1fr);
      align-items: center;
      gap: 36px;
      padding: 56px;
      isolation: isolate;
    }
    .pitch-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(90deg, rgba(0,0,0,0.38), rgba(0,0,0,0.92));
      opacity: 0.54;
    }
    .pitch-sentence {
      max-width: 760px;
      margin: 0;
      color: #f4f8f5;
      font-size: 58px;
      line-height: 1.02;
      font-weight: 680;
      text-wrap: balance;
    }
    .pitch-visual {
      position: relative;
      min-height: 420px;
      border-left: 1px solid rgba(255,255,255,0.08);
    }
    .pitch-node,
    .pitch-core,
    .pitch-token,
    .pitch-state-object,
    .pitch-kat-core,
    .pitch-graph-node {
      border: 1px solid color-mix(in srgb, var(--accent) 42%, rgba(255,255,255,0.18));
      background: rgba(8, 12, 14, 0.68);
      color: rgba(244,248,245,0.92);
      box-shadow: 0 16px 42px rgba(0,0,0,0.28), 0 0 24px color-mix(in srgb, var(--accent) 12%, transparent);
      font: 700 12px/1 "SFMono-Regular", Consolas, monospace;
      text-transform: uppercase;
    }
    .pitch-core,
    .pitch-kat-core {
      display: grid;
      place-items: center;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background:
        radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,0.06)), rgba(7,10,13,0.82) 66%),
        rgba(7,10,13,0.82);
      font-size: 14px;
    }
    .pitch-lineage {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(96px, 0.3fr) 160px;
      align-items: center;
      gap: 20px;
      padding-left: 32px;
    }
    .pitch-lineage-sources {
      display: grid;
      gap: 18px;
    }
    .pitch-lineage .pitch-node {
      display: grid;
      place-items: center;
      min-height: 62px;
      border-radius: 7px;
    }
    .pitch-lineage-paths {
      display: grid;
      gap: 28px;
    }
    .pitch-path,
    .pitch-beam,
    .pitch-edge {
      display: block;
      height: 1px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 15%, transparent), var(--accent), color-mix(in srgb, var(--accent2) 50%, transparent));
      transform-origin: left center;
      animation: pitchLineFlow 2.4s ease-in-out infinite;
    }
    .pitch-firehose {
      display: grid;
      place-items: center;
    }
    .pitch-token-stream {
      position: absolute;
      inset: 34px 120px 34px 0;
    }
    .pitch-token {
      position: absolute;
      left: calc(var(--i) * 15%);
      top: calc(18% + var(--i) * 13%);
      display: grid;
      place-items: center;
      width: 92px;
      height: 42px;
      border-radius: 999px;
      animation: pitchTokenFlow 3.4s ease-in-out infinite;
      animation-delay: calc(var(--i) * -0.32s);
    }
    .pitch-state-cube {
      position: relative;
      width: 220px;
      height: 220px;
      border: 1px solid color-mix(in srgb, var(--accent2) 42%, rgba(255,255,255,0.12));
      border-radius: 8px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent2) 24%, transparent), transparent),
        rgba(255,255,255,0.035);
      box-shadow: inset 0 0 48px rgba(255,255,255,0.05), 0 0 52px color-mix(in srgb, var(--accent2) 18%, transparent);
      animation: pitchCubeBreathe 3.6s ease-in-out infinite;
    }
    .pitch-state-cube span {
      position: absolute;
      inset: calc(20px + var(--i, 0) * 24px);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 6px;
    }
    .pitch-state-cube span:nth-child(1) { --i: 0; }
    .pitch-state-cube span:nth-child(2) { --i: 1; }
    .pitch-state-cube span:nth-child(3) { --i: 2; }
    .pitch-state-cube span:nth-child(4) { --i: 3; }
    .pitch-state-loss {
      display: grid;
      grid-template-columns: minmax(150px, 0.7fr) 86px minmax(170px, 0.8fr);
      align-items: center;
      gap: 22px;
      padding-left: 32px;
    }
    .pitch-capture-stack {
      position: relative;
      min-height: 240px;
    }
    .pitch-capture {
      position: absolute;
      left: calc(var(--i) * 22px);
      top: calc(var(--i) * 46px);
      display: grid;
      place-items: center;
      width: 170px;
      height: 92px;
      border-radius: 6px;
      color: rgba(244,248,245,0.68);
      animation: pitchCaptureFade 3.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.18s);
    }
    .pitch-compressor {
      height: 1px;
      background: rgba(255,255,255,0.13);
    }
    .pitch-compressor span {
      display: block;
      width: 100%;
      height: 1px;
      background: var(--accent);
      animation: pitchLineFlow 1.8s ease-in-out infinite;
    }
    .pitch-state-object {
      position: relative;
      display: grid;
      place-items: center;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle, color-mix(in srgb, var(--accent3) 20%, transparent), rgba(8,12,14,0.82) 70%),
        rgba(8,12,14,0.82);
    }
    .pitch-state-object i {
      position: absolute;
      inset: calc(20px + var(--i, 0) * 24px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;
      animation: pitchOrbitSpin 7s linear infinite;
    }
    .pitch-state-object i:nth-child(2) { --i: 0; }
    .pitch-state-object i:nth-child(3) { --i: 1; }
    .pitch-state-object i:nth-child(4) { --i: 2; }
    .pitch-channel-orbit,
    .pitch-agent-mesh {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .pitch-orbit-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 360px;
      margin: -180px 0 0 -180px;
      border: 1px solid color-mix(in srgb, var(--accent2) 36%, rgba(255,255,255,0.08));
      border-radius: 50%;
      animation: pitchOrbitSpin 16s linear infinite;
    }
    .pitch-orbit-node,
    .pitch-agent-node {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: 92px;
      height: 42px;
      margin: -21px 0 0 -46px;
      border-radius: 999px;
      transform: rotate(calc(var(--i) * 60deg)) translate(190px) rotate(calc(var(--i) * -60deg));
    }
    .pitch-agent-node {
      transform: rotate(calc(var(--i) * 60deg)) translate(176px) rotate(calc(var(--i) * -60deg));
      animation: pitchAgentPulse 2.8s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.12s);
    }
    .pitch-beam {
      position: absolute;
      left: calc(50% - 2px);
      top: 50%;
      width: 180px;
      transform-origin: left center;
    }
    .pitch-beam-a { transform: rotate(0deg); }
    .pitch-beam-b { transform: rotate(120deg); }
    .pitch-beam-c { transform: rotate(240deg); }
    .pitch-discovery-graph {
      overflow: hidden;
    }
    .pitch-graph-node {
      position: absolute;
      display: grid;
      place-items: center;
      width: 96px;
      height: 44px;
      border-radius: 7px;
    }
    .pitch-graph-node:nth-child(1) { left: 7%; top: 54%; }
    .pitch-graph-node:nth-child(2) { left: 25%; top: 25%; }
    .pitch-graph-node:nth-child(3) { left: 45%; top: 56%; }
    .pitch-graph-node:nth-child(4) { left: 62%; top: 30%; }
    .pitch-graph-node:nth-child(5) { left: 78%; top: 54%; }
    .pitch-graph-node:nth-child(6) { left: 49%; top: 78%; border-color: color-mix(in srgb, var(--accent2) 60%, white); }
    .pitch-edge {
      position: absolute;
      width: 170px;
      transform-origin: left center;
    }
    .pitch-edge-a { left: 18%; top: 53%; transform: rotate(-30deg); }
    .pitch-edge-b { left: 35%; top: 37%; transform: rotate(24deg); }
    .pitch-edge-c { left: 54%; top: 56%; transform: rotate(-32deg); }
    .pitch-edge-d { left: 64%; top: 67%; transform: rotate(160deg); }
    @keyframes pitchLineFlow {
      0%, 100% { opacity: 0.28; filter: brightness(0.9); }
      50% { opacity: 1; filter: brightness(1.35); }
    }
    @keyframes pitchTokenFlow {
      0%, 100% { transform: translateX(-28px); opacity: 0.42; }
      50% { transform: translateX(72px); opacity: 1; }
    }
    @keyframes pitchCubeBreathe {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
    }
    @keyframes pitchCaptureFade {
      0%, 100% { opacity: 0.34; transform: translateX(0); }
      50% { opacity: 0.72; transform: translateX(16px); }
    }
    @keyframes pitchOrbitSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes pitchAgentPulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0,0,0,0.26); }
      50% { box-shadow: 0 14px 38px rgba(0,0,0,0.26), 0 0 22px color-mix(in srgb, var(--accent) 34%, transparent); }
    }
    .generated-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 6px 10px;
      margin: 0 0 4px 0;
      border: 1px solid color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,0.08));
      border-radius: 6px;
      background: rgba(4, 7, 10, 0.42);
      color: rgba(232, 240, 255, 0.78);
      font: 600 11px/1.2 "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .generated-breadcrumb[hidden] { display: none; }
    .generated-breadcrumb-step {
      appearance: none;
      background: transparent;
      border: 0;
      padding: 4px 8px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      border-radius: 4px;
    }
    .generated-breadcrumb-step:hover,
    .generated-breadcrumb-step:focus-visible {
      background: color-mix(in srgb, var(--accent) 22%, rgba(255,255,255,0.06));
      color: #f5f9ff;
    }
    .generated-breadcrumb-step[aria-current="page"] {
      color: #ffffff;
      cursor: default;
      background: color-mix(in srgb, var(--accent) 28%, rgba(255,255,255,0.08));
    }
    .generated-breadcrumb-sep {
      color: color-mix(in srgb, var(--accent) 60%, rgba(232, 240, 255, 0.6));
      font-weight: 700;
    }
    .generated-page {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 34%, rgba(255,255,255,0.12));
      border-radius: 8px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 44%),
        rgba(4, 7, 10, 0.68);
      box-shadow: 0 24px 72px rgba(0,0,0,0.34);
      backdrop-filter: blur(14px);
      padding: 14px;
      overflow: hidden;
      animation: generatedPageIn 520ms ease both;
    }
    @keyframes generatedPageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .generated-page-head {
      min-width: 0;
      min-height: max-content;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      overflow: visible;
    }
    .generated-page-head > div {
      min-height: max-content;
    }
    .generated-page-kicker,
    .generated-page-section-label {
      color: var(--accent2);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .generated-page-head h2 {
      margin: 6px 0 0;
      font-size: clamp(28px, 4.2vh, 48px);
      line-height: 1.12;
      letter-spacing: 0;

    .attention-spikes .bar {
      min-height: 10px;
      height: auto;
      background: linear-gradient(180deg, var(--accent3), var(--accent), transparent);
    }
    .social-swarm .node {
      width: 8px;
      height: 8px;
    }

    .measurement-line {
      position: absolute;
      left: 4%;
      right: 34%;
      top: 31%;
      z-index: 4;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), rgba(255,255,255,0.80), transparent);
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent2) 28%, transparent);
      rotate: 2deg;
    }
    .quantum-field .state-orb {
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--accent2) 34%, white);
      background: radial-gradient(circle at 44% 42%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 65%);
    }
    .qbit {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .quantum-stack {
      position: absolute;
      right: 12px;
      top: 20%;
      bottom: 12px;
      width: 30%;
      z-index: 5;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .quantum-stack .scene-card {
      min-height: 0;
      padding: 10px;
      display: grid;
      align-content: center;
      gap: 6px;
      background: rgba(5, 7, 12, 0.88);
    }
    .quantum-stack .scene-card > span,
    .quantum-stack .scene-card > strong {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .quantum-stack .scene-card > strong {
      font-size: 20px;
      line-height: 1;
    }
    .quantum-shelf {
      position: absolute;
      left: 7%;
      right: 36%;
      bottom: 8%;
      height: 142px;
      z-index: 4;
      border: 1px solid color-mix(in srgb, var(--accent3) 42%, white);
      border-radius: 8px;
      background:
        radial-gradient(ellipse at 36% 46%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 42%),
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent 46%),
        linear-gradient(135deg, transparent 49%, color-mix(in srgb, var(--accent2) 24%, transparent) 50%, transparent 53%);
      overflow: hidden;
    }
    .quantum-shelf .bar {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 3px;
      transform-origin: left center;
    }

    .abyss .wave {
      position: absolute;
      left: -10%;
      right: -10%;
      height: 70px;
      border-top: 1px solid color-mix(in srgb, var(--accent2) 24%, white);
      border-radius: 50%;
    }
    .sensor-ping {
      width: 92px;
      height: 92px;
      border: 1px solid color-mix(in srgb, var(--accent2) 32%, white);
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent2) 18%, transparent);
      opacity: 0.58;
    }
    .vent {
      position: absolute;
      width: 34px;
      height: 92px;
      bottom: 6%;
      border-radius: 20px 20px 4px 4px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent3) 45%, transparent), rgba(0,0,0,0.28));
      box-shadow: 0 -22px 42px color-mix(in srgb, var(--accent3) 22%, transparent);
    }

    .gridops .grid-node {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid color-mix(in srgb, var(--accent) 58%, white);
      border-radius: 4px;
      background: rgba(0,0,0,0.36);
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .grid-backbone {
      position: absolute;
      left: 5%;
      right: 34%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
      opacity: 0.72;
      transform-origin: left center;
    }
    .backbone-a { top: 37%; rotate: 12deg; }
    .backbone-b { top: 61%; rotate: -9deg; }
    .power-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
      transform-origin: left center;
    }

    .outbreak-core {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at center, color-mix(in srgb, var(--danger) 46%, transparent), transparent 66%);
      border: 1px solid color-mix(in srgb, var(--danger) 34%, white);
      box-shadow: 0 0 34px color-mix(in srgb, var(--danger) 24%, transparent);
      opacity: 0.74;
    }
    .core-a { left: 18%; top: 22%; }
    .core-b { left: 56%; top: 32%; }
    .core-c { left: 38%; top: 62%; }
    .viralnet .person {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent2) 56%, transparent);
    }
    .scenario-curve {
      position: absolute;
      left: 7%;
      right: 7%;
      height: 34%;
      border-top: 2px solid var(--accent);
      border-radius: 50%;
    }

    .darkwatch .catalog-cell {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.34);
    }
    .anomaly-core {
      left: 18%;
      top: 29%;
      width: 96px;
      height: 96px;
      border: 1px solid color-mix(in srgb, var(--accent3) 38%, white);
      background: radial-gradient(circle at center, color-mix(in srgb, var(--accent3) 22%, transparent), transparent 68%);
      box-shadow: 0 0 38px color-mix(in srgb, var(--accent3) 22%, transparent);
      opacity: 0.72;
    }
    .dark-vector {
      left: 18%;
      width: 48%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent3) 52%, transparent), var(--accent2), transparent);
      opacity: 0.48;
    }
    .vector-a { top: 44%; rotate: 12deg; }
    .vector-b { top: 58%; rotate: -7deg; }
    .silence-window {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 9%;
      height: 72px;
      border: 1px solid color-mix(in srgb, var(--accent3) 25%, white);
      border-radius: 7px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.035), transparent);
    }

    /* ============================================================
       COCKPIT COMPONENTS
       Information-density layer that overlays the existing aesthetic.
       Adds pulse strip, sparklines, evidence stack, ranked rows,
       heat strips, provenance chips, narration ticker, action rail.
       Uses the same palette/border/blur language as panels above.
       ============================================================ */

    .topbar-meta {
      grid-column: 1 / -1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .topbar-meta:empty {
      display: none;
    }
    .provenance-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      padding: 3px 8px;
      border: 1px solid color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,0.10));
      border-radius: 999px;
      background: rgba(0,0,0,0.32);
      color: rgba(243,246,248,0.78);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .provenance-chip strong {
      color: var(--accent);
      font-weight: 720;
    }
    .provenance-chip.is-cached strong { color: var(--accent2); }
    .provenance-chip.is-synthetic { border-color: color-mix(in srgb, var(--accent3) 38%, rgba(255,255,255,0.10)); }
    .provenance-chip.is-synthetic strong { color: var(--accent3); }
    .provenance-chip.is-unavailable { border-color: color-mix(in srgb, var(--danger) 44%, rgba(255,255,255,0.10)); }
    .provenance-chip.is-unavailable strong { color: var(--danger); }
    .provenance-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 65%, transparent);
    }
    .provenance-chip.is-cached .dot { background: var(--accent2); box-shadow: 0 0 10px color-mix(in srgb, var(--accent2) 65%, transparent); }
    .provenance-chip.is-synthetic .dot { background: var(--accent3); box-shadow: 0 0 10px color-mix(in srgb, var(--accent3) 60%, transparent); }
    .provenance-chip.is-unavailable .dot { background: var(--danger); box-shadow: 0 0 10px color-mix(in srgb, var(--danger) 60%, transparent); }

    .lens-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: rgba(243,246,248,0.66);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .lens-chip strong {
      color: var(--accent2);
      font-weight: 720;
      margin-right: 6px;
    }

    .narration-ticker {
      flex: 1 1 280px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 6%, rgba(0,0,0,0.30)), rgba(0,0,0,0.30));
      color: rgba(243,246,248,0.86);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .narration-ticker .narration-prefix {
      color: var(--accent);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .narration-ticker .narration-line {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .narration-ticker.has-update {
      border-color: color-mix(in srgb, var(--accent) 48%, rgba(255,255,255,0.12));
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    /* ZONE B - Pulse strip: 60-cell horizontal sparkbar of channel main signal */
    .pulse-strip {
      min-width: 0;
      min-height: 56px;
      padding: 9px 12px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 92px;
      gap: 12px;
      align-items: center;
    }
    .pulse-strip-label {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .pulse-strip-label .pulse-kicker {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pulse-strip-label .pulse-now {
      color: var(--text);
      font-weight: 760;
      font-size: 18px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pulse-cells {
      min-width: 0;
      height: 36px;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 1px;
      align-items: end;
    }
    .pulse-cell {
      align-self: end;
      width: 100%;
      min-height: 2px;
      border-radius: 1px;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent2) 72%, transparent));
      opacity: 0.78;
    }
    .pulse-cell.down {
      background: linear-gradient(180deg, var(--danger), color-mix(in srgb, var(--accent3) 56%, transparent));
    }
    .pulse-cell.flat {
      background: rgba(255,255,255,0.18);
      opacity: 0.42;
    }
    .pulse-cell.pinned {
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent2) 80%, transparent);
      outline: 1px solid color-mix(in srgb, var(--accent2) 80%, white);
    }
    .pulse-strip-delta {
      text-align: right;
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .pulse-strip-delta .delta {
      font-weight: 760;
      font-size: 14px;
      line-height: 1;
    }
    .pulse-strip-delta .delta.up { color: var(--accent); }
    .pulse-strip-delta .delta.down { color: var(--danger); }
    .pulse-strip-delta .range {
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Sparklines inside metric tiles */
    .metric.spark-tile {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 4px;
      padding: 12px;
      min-height: 96px;
      overflow: hidden;
    }
    .metric.spark-tile::after {
      display: none;
    }
    .metric.spark-tile .metric-label {
      margin-bottom: 0;
    }
    .metric.spark-tile .metric-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .metric.spark-tile .metric-value {
      font-size: 24px;
    }
    .metric.spark-tile .metric-delta {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-delta.up { color: var(--accent); }
    .metric-delta.down { color: var(--danger); }
    .metric-delta.flat { color: var(--soft); }
    .metric.spark-tile .metric-spark {
      width: 100%;
      height: 22px;
      display: block;
    }
    .metric.spark-tile .metric-spark path.line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .metric.spark-tile .metric-spark path.area {
      fill: var(--accent);
      opacity: 0.18;
    }
    .metric.spark-tile.is-down .metric-spark path.line { stroke: var(--danger); }
    .metric.spark-tile.is-down .metric-spark path.area { fill: var(--danger); }

    /* Stage internal cockpit: thesis card + dense scene + small multiples */
    .stage-wrap.cockpit {
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 9px;
    }
    .stage-thesis {
      min-width: 0;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, rgba(255,255,255,0.10));
      border-radius: 7px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 6%, transparent), transparent 56%), rgba(0,0,0,0.30);
      box-shadow: inset 0 0 22px rgba(255,255,255,0.025);
    }
    .stage-thesis .thesis-headline {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.3;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .stage-thesis .thesis-headline strong {
      color: var(--accent2);
      font-weight: 720;
    }
    .stage-thesis .thesis-trail {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 4px;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .stage-thesis .thesis-trail .pip {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }
    .stage-thesis .thesis-figure {
      min-width: 96px;
      text-align: right;
    }
    .stage-thesis .thesis-figure .big {
      font-size: 24px;
      font-weight: 760;
      line-height: 1;
      color: var(--text);
    }
    .stage-thesis .thesis-figure .big.up { color: var(--accent); }
    .stage-thesis .thesis-figure .big.down { color: var(--danger); }
    .stage-thesis .thesis-figure .small {
      margin-top: 4px;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    /* ZONE D - small multiples row below stage */
    .small-multiples {
      min-width: 0;
      min-height: 86px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 8px;
    }
    .small-multi {
      min-width: 0;
      min-height: 86px;
      padding: 9px 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background: rgba(0,0,0,0.32);
      overflow: hidden;
    }
    .small-multi .sm-label {
      color: var(--accent2);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .small-multi .sm-vis {
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .small-multi .sm-vis svg {
      width: 100%;
      height: 100%;
      min-height: 36px;
      display: block;
    }
    .small-multi .sm-foot {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .small-multi .sm-value {
      font-size: 14px;
      font-weight: 760;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .small-multi .sm-note {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mini bars for small-multi inline grids */
    .sm-bars {
      width: 100%;
      height: 100%;
      min-height: 36px;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 2px;
      align-items: end;
    }
    .sm-bars span {
      width: 100%;
      align-self: end;
      min-height: 2px;
      border-radius: 1px;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent2) 60%, transparent));
      opacity: 0.82;
    }
    .sm-bars span.down {
      background: linear-gradient(180deg, var(--danger), color-mix(in srgb, var(--accent3) 50%, transparent));
    }
    .sm-bars span.flat {
      background: rgba(255,255,255,0.20);
      opacity: 0.5;
    }

    /* Sparkline (svg path inline) */
    svg.spark path.line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    svg.spark path.area {
      fill: var(--accent);
      opacity: 0.16;
    }
    svg.spark.down path.line { stroke: var(--danger); }
    svg.spark.down path.area { fill: var(--danger); }
    svg.spark.amber path.line { stroke: var(--accent3); }
    svg.spark.amber path.area { fill: var(--accent3); }
    svg.spark.cyan path.line { stroke: var(--accent2); }
    svg.spark.cyan path.area { fill: var(--accent2); }
    svg.spark .baseline {
      stroke: rgba(255,255,255,0.10);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    /* ZONE E - Evidence stack replacing decorative mini-visual */
    .evidence-stack {
      min-width: 0;
      padding: 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 9px;
      overflow: hidden;
    }
    .evidence-stack .section-head {
      min-height: 28px;
    }
    .evidence-cards {
      min-height: 0;
      display: grid;
      gap: 7px;
      overflow: auto;
      grid-auto-rows: max-content;
      padding-right: 4px;
    }
    .evidence-card {
      min-width: 0;
      padding: 9px 10px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 7px;
      background: rgba(0,0,0,0.30);
      box-shadow: 0 4px 16px rgba(0,0,0,0.16);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .evidence-card:hover {
      border-color: color-mix(in srgb, var(--accent) 48%, white);
      background: color-mix(in srgb, var(--accent) 8%, rgba(0,0,0,0.30));
    }
    .evidence-card.is-warn {
      border-color: color-mix(in srgb, var(--accent3) 40%, rgba(255,255,255,0.12));
    }
    .evidence-card.is-alert {
      border-color: color-mix(in srgb, var(--danger) 48%, rgba(255,255,255,0.12));
    }
    .evidence-card .ev-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .evidence-card .ev-label {
      color: var(--accent2);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .evidence-card .ev-meta {
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .evidence-card .ev-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .evidence-card .ev-value {
      font-size: 18px;
      font-weight: 760;
      line-height: 1;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .evidence-card.is-warn .ev-value { color: var(--accent3); }
    .evidence-card.is-alert .ev-value { color: var(--danger); }
    .evidence-card .ev-vis {
      min-width: 80px;
      max-width: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .evidence-card .ev-vis svg {
      width: 100%;
      max-width: 110px;
      height: 18px;
      display: block;
    }
    .evidence-card .ev-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-width: 0;
    }
    .evidence-card .ev-foot .ev-bar {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), rgba(255,255,255,0.06));
      opacity: 0.72;
    }
    .evidence-card.is-warn .ev-foot .ev-bar { background: linear-gradient(90deg, var(--accent3), color-mix(in srgb, var(--danger) 40%, transparent), rgba(255,255,255,0.06)); }
    .evidence-card.is-alert .ev-foot .ev-bar { background: linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--accent3) 60%, transparent), rgba(255,255,255,0.06)); }

    /* ZONE F - action rail */
    .action-rail {
      min-width: 0;
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 5%, transparent), transparent 56%), rgba(2, 5, 8, 0.62);
      box-shadow: 0 12px 36px rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
    }
    .action-rail.is-empty { display: none; }
    .action-rail-label {
      flex-shrink: 0;
      min-width: 70px;
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .action-rail-prompts {
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 1px;
    }
    .action-rail-prompts::-webkit-scrollbar { height: 4px; }
    .action-rail-prompts::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 999px; }
    .action-chip-btn {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 6px 11px;
      max-width: 320px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid color-mix(in srgb, var(--accent2) 28%, rgba(255,255,255,0.10));
      border-radius: 6px;
      background: rgba(0,0,0,0.30);
      color: rgba(243,246,248,0.84);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .action-chip-btn::before {
      content: "▸";
      color: var(--accent);
      flex-shrink: 0;
    }
    .action-chip-btn:hover,
    .action-chip-btn:focus-visible {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 60%, white);
      background: color-mix(in srgb, var(--accent) 10%, rgba(0,0,0,0.30));
    }
    .action-rail-target,
    .action-rail-share {
      flex-shrink: 0;
      min-height: 30px;
      padding: 6px 12px;
      border: 1px solid color-mix(in srgb, var(--accent2) 48%, white);
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      color: rgba(243,246,248,0.94);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .action-rail-target {
      border-color: color-mix(in srgb, var(--accent) 42%, rgba(255,255,255,0.20));
      color: color-mix(in srgb, var(--accent) 82%, white);
    }
    .action-rail-target.active {
      background: color-mix(in srgb, var(--accent) 16%, rgba(0,0,0,0.32));
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .action-rail-share:hover,
    .action-rail-share:focus-visible,
    .action-rail-target:hover,
    .action-rail-target:focus-visible {
      outline: none;
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, rgba(0,0,0,0.30));
    }

    body.kat-target-mode .workspace,
    body.kat-target-mode .topbar {
      cursor: crosshair;
    }
    body.kat-target-mode .metric:hover,
    body.kat-target-mode .module:hover,
    body.kat-target-mode .feed-item:hover,
    body.kat-target-mode .generated-component:hover,
    body.kat-target-mode .dense-panel:hover,
    body.kat-target-mode .scene-card:hover {
      outline: 1px solid color-mix(in srgb, var(--accent) 58%, white);
      outline-offset: 3px;
    }
    .kat-target-ring {
      position: fixed;
      z-index: 42;
      pointer-events: none;
      border: 1px solid color-mix(in srgb, var(--accent) 72%, white);
      border-radius: 10px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.42), 0 0 30px color-mix(in srgb, var(--accent) 26%, transparent);
    }
    .kat-target-ring[hidden],
    .kat-target-modal[hidden] {
      display: none;
    }
    .kat-target-modal {
      position: fixed;
      z-index: 43;
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid color-mix(in srgb, var(--accent2) 34%, rgba(255,255,255,0.14));
      border-radius: 8px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 52%),
        rgba(4, 7, 10, 0.96);
      box-shadow: 0 22px 72px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter: blur(16px) saturate(1.18);
    }
    .kat-target-form {
      display: grid;
      gap: 10px;
    }
    .kat-target-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .kat-target-kicker {
      color: var(--accent);
      font: 800 9px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .kat-target-name {
      margin-top: 5px;
      color: rgba(243,246,248,0.92);
      font-size: 15px;
      font-weight: 760;
      line-height: 1.16;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kat-target-close {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }
    .kat-target-input {
      width: 100%;
      min-height: 42px;
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 7px;
      background: rgba(0,0,0,0.34);
      color: var(--text);
      font: 13px/1.25 Inter, "Helvetica Neue", Arial, sans-serif;
      outline: none;
    }
    .kat-target-input:focus {
      border-color: color-mix(in srgb, var(--accent) 62%, white);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .kat-target-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .kat-target-chip {
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      color: rgba(243,246,248,0.78);
      font: 800 9px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .kat-target-actions {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
    }
    .kat-target-voice,
    .kat-target-submit {
      min-height: 34px;
      padding: 0 12px;
      font: 800 10px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .kat-target-voice.listening {
      border-color: var(--danger);
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 12%, rgba(0,0,0,0.32));
    }
    .kat-target-submit {
      border-color: color-mix(in srgb, var(--accent) 56%, white);
      background: color-mix(in srgb, var(--accent) 18%, rgba(0,0,0,0.30));
      color: rgba(243,246,248,0.94);
    }
    .kat-target-status {
      min-height: 13px;
      color: var(--soft);
      font: 9px/1.2 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Dense scene-internal components used by re-built scene renderers */
    .dense-scene {
      position: absolute;
      inset: 14px;
      z-index: 2;
      min-height: 0;
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .dense-scene.with-aside {
      grid-template-columns: minmax(0, 1.6fr) minmax(220px, 0.8fr);
    }
    .dense-scene.with-bottom {
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .dense-scene.full {
      grid-template-columns: 1fr;
    }
    .dense-panel {
      min-width: 0;
      min-height: 0;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 7px;
      background: rgba(2, 5, 9, 0.62);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.24);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      overflow: hidden;
    }
    .dense-panel .dense-panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .dense-panel .dense-panel-title {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .dense-panel .dense-panel-meta {
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dense-panel .dense-panel-body {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 6px;
      overflow: hidden;
    }

    /* Ranked rows: name + bar + delta + spark + source */
    .rank-list {
      min-width: 0;
      display: grid;
      gap: 5px;
      overflow: hidden;
    }
    .rank-row {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1.1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px;
      background: rgba(0,0,0,0.20);
      transition: border-color 140ms ease, background 140ms ease;
    }
    .rank-row:hover {
      border-color: color-mix(in srgb, var(--accent) 40%, white);
      background: color-mix(in srgb, var(--accent) 6%, rgba(0,0,0,0.30));
    }
    .rank-row .rk-name {
      min-width: 0;
      color: rgba(243,246,248,0.92);
      font-size: 12px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-row .rk-name .rk-source {
      display: block;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .rank-row .rk-bar {
      min-width: 0;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
    }
    .rank-row .rk-bar::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--rk-w, 50%);
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent2) 60%, transparent));
      border-radius: 999px;
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 36%, transparent);
    }
    .rank-row.is-down .rk-bar::after {
      background: linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--accent3) 56%, transparent));
      box-shadow: 0 0 12px color-mix(in srgb, var(--danger) 30%, transparent);
    }
    .rank-row.is-warn .rk-bar::after {
      background: linear-gradient(90deg, var(--accent3), color-mix(in srgb, var(--accent2) 50%, transparent));
    }
    .rank-row .rk-delta {
      min-width: 48px;
      text-align: right;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 720;
      letter-spacing: 0.04em;
      color: var(--accent);
      white-space: nowrap;
    }
    .rank-row.is-down .rk-delta { color: var(--danger); }
    .rank-row.is-warn .rk-delta { color: var(--accent3); }
    .rank-row.is-flat .rk-delta { color: var(--soft); }
    .rank-row .rk-spark {
      width: 56px;
      height: 18px;
      flex-shrink: 0;
    }
    .rank-row .rk-spark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Heat strip: 2D matrix of small cells */
    .heat-strip {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 2px;
      overflow: hidden;
    }
    .heat-strip-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .heat-strip-row .hs-name {
      color: rgba(243,246,248,0.86);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .heat-strip-row .hs-cells {
      min-width: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 1px;
      height: 14px;
    }
    .heat-strip-row .hs-cell {
      width: 100%;
      height: 100%;
      border-radius: 1px;
      background: rgba(255,255,255,0.04);
    }
    .heat-strip-row .hs-cell.l1 { background: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,0.04)); }
    .heat-strip-row .hs-cell.l2 { background: color-mix(in srgb, var(--accent) 36%, rgba(255,255,255,0.04)); }
    .heat-strip-row .hs-cell.l3 { background: color-mix(in srgb, var(--accent2) 52%, rgba(255,255,255,0.04)); }
    .heat-strip-row .hs-cell.l4 { background: color-mix(in srgb, var(--accent3) 58%, rgba(255,255,255,0.04)); }
    .heat-strip-row .hs-cell.l5 { background: color-mix(in srgb, var(--danger) 62%, rgba(255,255,255,0.04)); box-shadow: 0 0 6px color-mix(in srgb, var(--danger) 36%, transparent); }
    .heat-strip-row .hs-cell.pinned {
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 80%, transparent);
      outline: 1px solid color-mix(in srgb, var(--accent2) 65%, white);
    }
    .heat-strip-axis {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .heat-strip-axis .hs-axis-cells {
      display: flex;
      justify-content: space-between;
    }

    /* Depth ladder: bid/ask levels with width + price labels */
    .depth-ladder {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 2px;
      align-content: stretch;
    }
    .depth-ladder-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 60px;
      gap: 6px;
      align-items: center;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      color: rgba(243,246,248,0.78);
    }
    .depth-ladder-row .dl-px {
      text-align: right;
    }
    .depth-ladder-row .dl-bar {
      height: 6px;
      border-radius: 1px;
      position: relative;
      background: rgba(255,255,255,0.05);
    }
    .depth-ladder-row .dl-bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--dl-w, 50%);
      border-radius: 1px;
    }
    .depth-ladder-row.bid .dl-bar::after {
      right: 0;
      background: linear-gradient(90deg, transparent, var(--accent));
    }
    .depth-ladder-row.ask .dl-bar::after {
      left: 0;
      background: linear-gradient(90deg, var(--danger), transparent);
    }
    .depth-ladder-row .dl-sz {
      color: rgba(243,246,248,0.72);
      text-align: right;
    }
    .depth-spread {
      text-align: center;
      padding: 4px 0;
      color: var(--accent2);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      border-top: 1px dashed rgba(255,255,255,0.12);
      border-bottom: 1px dashed rgba(255,255,255,0.12);
      margin: 4px 0;
    }

    /* Distribution band: horizontal band p10/p50/p90 */
    .dist-band {
      width: 100%;
      height: 100%;
      min-height: 36px;
      position: relative;
    }
    .dist-band .db-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }
    .dist-band .db-band {
      position: absolute;
      top: 50%;
      height: 12px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent3) 36%, transparent), color-mix(in srgb, var(--accent) 64%, transparent), color-mix(in srgb, var(--accent2) 38%, transparent));
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .dist-band .db-now {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 22px;
      transform: translate(-50%, -50%);
      background: var(--text);
      box-shadow: 0 0 10px var(--text);
    }
    .dist-band .db-label {
      position: absolute;
      bottom: -16px;
      transform: translateX(-50%);
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Dossier panel: lead story / anchor entity card */
    .dossier {
      min-width: 0;
      min-height: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent2) 26%, rgba(255,255,255,0.10));
      border-radius: 7px;
      background:
        radial-gradient(circle at 14% 18%, color-mix(in srgb, var(--accent2) 14%, transparent), transparent 32%),
        rgba(0, 0, 0, 0.40);
    }
    .dossier .doss-eyebrow {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .dossier .doss-headline {
      color: var(--text);
      font-size: 18px;
      font-weight: 720;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .dossier .doss-list {
      min-width: 0;
      display: grid;
      gap: 5px;
      overflow: hidden;
    }

    /* Two-lane match for Arena */
    .match-lanes {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12px minmax(0, 1fr);
      gap: 10px;
    }
    .match-lane {
      min-width: 0;
      min-height: 0;
      padding: 11px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 7px;
      background: rgba(0,0,0,0.32);
    }
    .match-lane.win {
      border-color: color-mix(in srgb, var(--accent) 56%, white);
      box-shadow: inset 0 0 24px color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .match-lane .ml-name {
      color: var(--accent2);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .match-lane .ml-score {
      font-size: 30px;
      font-weight: 760;
      line-height: 1;
      color: var(--text);
    }
    .match-lane .ml-stream {
      min-height: 0;
      overflow: hidden;
      display: grid;
      gap: 4px;
      align-content: start;
    }
    .match-lane .ml-stream span {
      height: 8px;
      border-radius: 2px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 32%, transparent), rgba(255,255,255,0.04));
    }
    .match-lane .ml-foot {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .match-lane .ml-foot span {
      padding: 2px 6px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      background: rgba(0,0,0,0.30);
    }
    .match-judge {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 11px 0;
    }
    .match-judge .mj-tick {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .match-judge .mj-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* Cluster matrix (SPECTRE) */
    .cluster-matrix {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 4px;
      overflow: hidden;
    }
    .cluster-row {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) 56px;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .cluster-row .cl-name {
      color: rgba(243,246,248,0.92);
      font-size: 11px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cluster-row .cl-name .cl-meta {
      display: block;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .cluster-row .cl-cells {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 1px;
      height: 18px;
      min-width: 0;
    }
    .cluster-row .cl-cell {
      align-self: center;
      width: 100%;
      height: 100%;
      border-radius: 1px;
      background: rgba(255,255,255,0.04);
    }
    .cluster-row .cl-cell.l1 { background: color-mix(in srgb, var(--accent2) 22%, rgba(255,255,255,0.04)); }
    .cluster-row .cl-cell.l2 { background: color-mix(in srgb, var(--accent2) 44%, rgba(255,255,255,0.04)); }
    .cluster-row .cl-cell.l3 { background: color-mix(in srgb, var(--accent) 56%, rgba(255,255,255,0.04)); }
    .cluster-row .cl-cell.l4 { background: color-mix(in srgb, var(--accent3) 60%, rgba(255,255,255,0.04)); }
    .cluster-row .cl-cell.l5 { background: var(--danger); box-shadow: 0 0 6px color-mix(in srgb, var(--danger) 40%, transparent); }
    .cluster-row .cl-conf {
      text-align: right;
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 720;
    }

    /* Pipeline matrix (Biotech) */
    .pipeline-matrix {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 4px;
      grid-template-rows: auto repeat(auto-fit, minmax(22px, 1fr));
    }
    .pipeline-axis {
      display: grid;
      grid-template-columns: 120px repeat(5, minmax(0, 1fr));
      gap: 4px;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pipeline-row {
      display: grid;
      grid-template-columns: 120px repeat(5, minmax(0, 1fr));
      gap: 4px;
      align-items: center;
      min-width: 0;
    }
    .pipeline-row .pp-name {
      color: rgba(243,246,248,0.90);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pipeline-row .pp-cell {
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(243,246,248,0.6);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
    }
    .pipeline-row .pp-cell.l1 { background: color-mix(in srgb, var(--accent2) 22%, rgba(255,255,255,0.04)); color: var(--accent2); }
    .pipeline-row .pp-cell.l2 { background: color-mix(in srgb, var(--accent2) 38%, rgba(255,255,255,0.04)); color: var(--accent2); }
    .pipeline-row .pp-cell.l3 { background: color-mix(in srgb, var(--accent) 48%, rgba(255,255,255,0.04)); color: var(--text); }
    .pipeline-row .pp-cell.l4 { background: color-mix(in srgb, var(--accent3) 56%, rgba(255,255,255,0.04)); color: var(--text); }
    .pipeline-row .pp-cell.l5 { background: var(--danger); color: var(--text); }
    .pipeline-row .pp-cell.pinned { outline: 1px solid var(--accent2); }

    /* Light-curve overlay (observatory / dark-forest) */
    .lightcurve-stack {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 6px;
    }
    .lightcurve {
      min-height: 0;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 56px;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px;
      background: rgba(0,0,0,0.22);
    }
    .lightcurve .lc-name {
      color: rgba(243,246,248,0.88);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lightcurve .lc-name .lc-source {
      display: block;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .lightcurve .lc-svg {
      width: 100%;
      height: 28px;
    }
    .lightcurve .lc-sigma {
      text-align: right;
      color: var(--accent3);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 720;
    }
    .lightcurve.is-anomaly .lc-sigma { color: var(--danger); }
    .lightcurve.is-anomaly { border-color: color-mix(in srgb, var(--danger) 38%, rgba(255,255,255,0.10)); }

    /* Token velocity scatter */
    .scatter-board {
      position: relative;
      min-width: 0;
      min-height: 120px;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        rgba(0,0,0,0.30);
      background-size: 28px 28px;
    }
    .scatter-board .sc-axis-x,
    .scatter-board .sc-axis-y {
      position: absolute;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8.5px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .scatter-board .sc-axis-x { right: 8px; bottom: 6px; }
    .scatter-board .sc-axis-y { left: 8px; top: 6px; writing-mode: vertical-rl; transform: rotate(180deg); }
    .scatter-board .sc-frontier {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 32%;
      bottom: 22%;
      border-top: 1px dashed color-mix(in srgb, var(--accent3) 50%, transparent);
      border-radius: 60% 0 0 0;
      pointer-events: none;
    }
    .scatter-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);
      transform: translate(-50%, -50%);
    }
    .scatter-dot.warn { background: var(--accent3); box-shadow: 0 0 10px color-mix(in srgb, var(--accent3) 60%, transparent); }
    .scatter-dot.alert { background: var(--danger); box-shadow: 0 0 12px color-mix(in srgb, var(--danger) 70%, transparent); }
    .scatter-dot .sc-label {
      position: absolute;
      left: 12px;
      top: -2px;
      color: rgba(243,246,248,0.86);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 860px) {

      .topbar-meta { flex-direction: column; align-items: stretch; }

    html.blank-dashboard-root,

    body.blank-dashboard .kicker,

        rgba(0,0,0,0.22);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;

  </style>

  <main class="app">
