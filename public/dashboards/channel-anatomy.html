<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Channel Anatomy — three layers, one object</title>
<style>
  :root {
    --bg0: #02070c;
    --bg1: #07181b;
    --text: #f3f6f8;
    --muted: rgba(243,246,248,0.66);
    --dim:   rgba(243,246,248,0.46);
    --accent:  #30d5ff;  /* input  — cyan  */
    --accent2: #62ffbd;  /* agent  — mint  */
    --accent3: #ffbf5f;  /* surface — amber */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    background:
      radial-gradient(circle at 18% 14%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 30%),
      radial-gradient(circle at 82% 66%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 34%),
      linear-gradient(135deg, var(--bg0), var(--bg1) 58%, #030405);
    padding: clamp(20px, 4vh, 48px) clamp(16px, 4vw, 56px);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px;
    opacity: 0.9;
    z-index: 0;
  }

  .ca-shell {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    gap: clamp(14px, 2vh, 22px);
  }

  .ca-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }

  .ca-step-label {
    color: var(--text);
    font-size: clamp(18px, 2.1vw, 30px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: 0;
    text-shadow: 0 0 18px color-mix(in srgb, var(--accent2) 16%, transparent);
  }

  .ca-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .ca-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 14px;
    border: 1px solid color-mix(in srgb, var(--accent2) 22%, rgba(255,255,255,0.08));
    border-radius: 7px;
    background: rgba(0,0,0,0.38);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: inset 0 0 18px rgba(255,255,255,0.018);
  }
  .ca-button:hover,
  .ca-button:focus-visible {
    border-color: color-mix(in srgb, var(--accent2) 54%, rgba(255,255,255,0.18));
    background: color-mix(in srgb, var(--accent2) 10%, rgba(0,0,0,0.48));
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent2) 12%, transparent);
    outline: none;
  }
  .ca-button .play-icon {
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid currentColor;
  }

  .ca-viewport {
    background: rgba(1, 7, 9, 0.76);
    border: 1px solid color-mix(in srgb, var(--accent2) 14%, rgba(255,255,255,0.06));
    border-radius: 14px;
    padding: clamp(14px, 2.4vw, 28px);
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(255,255,255,0.018),
      0 12px 48px rgba(0,0,0,0.32);
  }

  .ca-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .ca-svg text {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    letter-spacing: 0;
    fill: var(--text);
  }

  /* ---- layer wrappers (input / agent / surface) ---------------------- */
  .layer { opacity: 0; transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.4,0,.2,1); transform: translateY(8px); transform-box: fill-box; }
  .layer.in { opacity: 1; transform: translateY(0); }

  .layer-shell rect {
    fill: rgba(0,0,0,0.32);
    stroke-width: 1.1;
  }

  /* layer accent colors */
  .l-input  .layer-shell rect { stroke: color-mix(in srgb, var(--accent)  46%, rgba(255,255,255,0.1));  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent)  10%, transparent)); }
  .l-agent  .layer-shell rect { stroke: color-mix(in srgb, var(--accent2) 46%, rgba(255,255,255,0.1));  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent2) 10%, transparent)); }
  .l-surface .layer-shell rect{ stroke: color-mix(in srgb, var(--accent3) 46%, rgba(255,255,255,0.1));  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent3) 10%, transparent)); }

  .l-input  .layer-tag { fill: var(--accent);  }
  .l-agent  .layer-tag { fill: var(--accent2); }
  .l-surface .layer-tag{ fill: var(--accent3); }

  /* pills inside layers */
  .pill rect {
    fill: color-mix(in srgb, var(--pill-accent, var(--accent)) 8%, rgba(1,7,9,0.76));
    stroke: color-mix(in srgb, var(--pill-accent, var(--accent)) 46%, rgba(255,255,255,0.1));
    stroke-width: 1.1;
    filter: drop-shadow(0 0 12px color-mix(in srgb, var(--pill-accent, var(--accent)) 10%, transparent));
  }
  .pill .pill-dot { fill: var(--pill-accent, var(--accent)); }
  .l-input  .pill { --pill-accent: var(--accent);  }
  .l-agent  .pill { --pill-accent: var(--accent2); }
  .l-surface .pill{ --pill-accent: var(--accent3); }

  /* text styles */
  .ca-th { font-size: 17px; font-weight: 800; fill: var(--text); }
  .ca-ts { font-size: 14px; font-weight: 650; fill: var(--text); }
  .ca-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; }
  .ca-note { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: 0.02em; }
  .ca-note-dim { font-size: 11px; font-weight: 600; fill: var(--dim); letter-spacing: 0.02em; }
  .ca-quote { font-style: italic; }

  /* surface mini-widgets */
  .mini-metric    { fill: var(--text); }
  .mini-delta-pos { fill: var(--accent2); }
  .mini-axis      { stroke: color-mix(in srgb, var(--accent3) 40%, transparent); stroke-width: 0.5; }
  .mini-line      { fill: none; stroke: var(--accent3); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent3) 60%, transparent)); }
  .mini-fill      { fill: color-mix(in srgb, var(--accent3) 22%, transparent); stroke: none; }
  .mini-cursor    { fill: var(--accent3); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent3) 75%, transparent)); }
  .mini-row       { stroke: color-mix(in srgb, var(--accent3) 35%, transparent); stroke-width: 0.5; }
  .mini-bullet    { fill: var(--accent3); }

  /* live indicator on input + surface */
  .live-dot {
    fill: var(--accent2);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent2) 60%, transparent));
    animation: ca-pulse 1400ms ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .surface-live-dot {
    fill: var(--accent3);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent3) 70%, transparent));
    animation: ca-pulse 1400ms ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes ca-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.72); }
  }
  .live-text {
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
    fill: var(--accent3);
  }

  /* connectors */
  .connector { opacity: 0; transition: opacity 0.4s ease; }
  .connector.in { opacity: 1; }
  .connector line { stroke: color-mix(in srgb, var(--accent2) 50%, rgba(243,246,248,0.18)); stroke-width: 1.4; stroke-dasharray: 4 5; stroke-linecap: round; }

  /* bracket */
  .bracket { opacity: 0; transition: opacity 0.7s ease; }
  .bracket.in { opacity: 1; }
  .bracket path { fill: none; stroke: color-mix(in srgb, var(--accent2) 56%, rgba(255,255,255,0.14)); stroke-width: 1.2; }
  .bracket text { fill: var(--text); font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }

  /* caption */
  .ca-caption {
    padding: 16px 20px;
    background: rgba(1,7,9,0.72);
    border: 1px solid color-mix(in srgb, var(--accent2) 18%, rgba(255,255,255,0.06));
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
  }
  .ca-caption b { color: var(--text); font-weight: 800; }
</style>
</head>
<body>
  <div class="ca-shell">
    <header class="ca-toolbar">
      <div class="ca-step-label" id="step-label">A channel is three layers, packaged as one thing</div>
      <div class="ca-controls">
        <button class="ca-button" type="button" id="replay-btn">
          <span class="play-icon" aria-hidden="true"></span>
          <span>Replay</span>
        </button>
      </div>
    </header>

    <div class="ca-viewport">
      <svg class="ca-svg" viewBox="0 0 800 440" role="img" aria-labelledby="ca-title ca-desc">
        <title id="ca-title">What a channel is</title>
        <desc id="ca-desc">A live input flows into a specialist agent that builds a mutable surface. Together they are one channel.</desc>

        <defs>
          <marker id="ca-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- ============ INPUT LAYER ============ -->
        <g class="layer l-input" id="layer-input">
          <g class="layer-shell">
            <rect x="40" y="40" width="640" height="92" rx="14"/>
          </g>
          <text class="ca-tag layer-tag" x="60" y="62" dominant-baseline="central">INPUT</text>

          <g class="pill">
            <rect x="100" y="80" width="240" height="40" rx="20"/>
            <circle class="pill-dot live-dot" cx="170" cy="100" r="4"/>
            <text class="ca-th" x="186" y="101" dominant-baseline="central">Live data</text>
          </g>
          <g class="pill">
            <rect x="380" y="80" width="240" height="40" rx="20"/>
            <text class="ca-th ca-quote" x="500" y="101" text-anchor="middle" dominant-baseline="central">"what's happening?"</text>
          </g>
        </g>

        <g class="connector" id="connector-1">
          <line x1="360" y1="146" x2="360" y2="172" marker-end="url(#ca-arrow)"/>
        </g>

        <!-- ============ AGENT LAYER ============ -->
        <g class="layer l-agent" id="layer-agent">
          <g class="layer-shell">
            <rect x="40" y="180" width="640" height="80" rx="14"/>
          </g>
          <text class="ca-tag layer-tag" x="60" y="202" dominant-baseline="central">AGENT</text>

          <g class="pill">
            <rect x="60" y="216" width="600" height="36" rx="18"/>
            <circle class="pill-dot" cx="80" cy="234" r="4"/>
            <text class="ca-ts" x="94" y="235" dominant-baseline="central">Specialist · picks what to query and how to show it</text>
          </g>
        </g>

        <g class="connector" id="connector-2">
          <line x1="360" y1="274" x2="360" y2="300" marker-end="url(#ca-arrow)"/>
        </g>

        <!-- ============ SURFACE LAYER (mutable) ============ -->
        <g class="layer l-surface" id="layer-surface">
          <g class="layer-shell">
            <rect x="40" y="308" width="640" height="116" rx="14"/>
          </g>
          <text class="ca-tag layer-tag" x="60" y="330" dominant-baseline="central">SURFACE</text>

          <!-- LIVE indicator -->
          <g transform="translate(636,320)">
            <circle class="surface-live-dot" cx="0" cy="0" r="3.2"/>
            <text class="live-text" x="9" y="0" dominant-baseline="central">LIVE</text>
          </g>

          <!-- ticking metric -->
          <g class="pill">
            <rect x="60" y="342" width="148" height="70" rx="10"/>
            <text class="mini-metric" id="ca-metric" x="74" y="372" dominant-baseline="central" style="font-size:22px; font-weight:800;">$103.2k</text>
            <text class="mini-delta-pos" id="ca-delta" x="74" y="394" dominant-baseline="central" style="font-size:12px; font-weight:800;">+2.4%</text>
          </g>

          <!-- animated sparkline -->
          <g class="pill">
            <rect x="222" y="342" width="240" height="70" rx="10"/>
            <line class="mini-axis" x1="236" y1="404" x2="448" y2="404"/>
            <polygon class="mini-fill" id="ca-spark-fill" points=""/>
            <polyline class="mini-line" id="ca-spark" points=""/>
            <circle class="mini-cursor" id="ca-spark-cursor" cx="448" cy="376" r="3"/>
          </g>

          <!-- rail rows with ticking times -->
          <g class="pill">
            <rect x="476" y="342" width="184" height="70" rx="10"/>
            <line class="mini-row" x1="490" y1="360" x2="646" y2="360"/>
            <line class="mini-row" x1="490" y1="378" x2="646" y2="378"/>
            <line class="mini-row" x1="490" y1="396" x2="646" y2="396"/>
            <circle class="mini-bullet" cx="496" cy="360" r="2.2"/>
            <circle class="mini-bullet" cx="496" cy="378" r="2.2"/>
            <circle class="mini-bullet" cx="496" cy="396" r="2.2"/>
            <text class="ca-note" id="ca-row-1" x="642" y="360" text-anchor="end" dominant-baseline="central" style="font-size:9.5px;">3s</text>
            <text class="ca-note" id="ca-row-2" x="642" y="378" text-anchor="end" dominant-baseline="central" style="font-size:9.5px;">12s</text>
            <text class="ca-note" id="ca-row-3" x="642" y="396" text-anchor="end" dominant-baseline="central" style="font-size:9.5px;">31s</text>
          </g>
        </g>

        <!-- ============ BRACKET ============ -->
        <g class="bracket" id="bracket">
          <path d="M696 44 Q708 44 708 64 L708 224 Q708 232 718 232 Q708 232 708 240 L708 420 Q708 428 696 428"/>
          <text x="744" y="232" text-anchor="middle" dominant-baseline="central" style="writing-mode:vertical-rl; transform: rotate(180deg); transform-origin:744px 232px;">one channel</text>
        </g>
      </svg>
    </div>

    <div class="ca-caption">
      A live data feed and your prompt flow into a specialist agent. A surface rebuilds in response — and keeps mutating as the world changes. The whole thing is one live object.
    </div>
  </div>

<script>
  (function () {
    const els = {
      input:   document.getElementById('layer-input'),
      c1:      document.getElementById('connector-1'),
      agent:   document.getElementById('layer-agent'),
      c2:      document.getElementById('connector-2'),
      surface: document.getElementById('layer-surface'),
      bracket: document.getElementById('bracket'),
    };
    const order = [
      ['input',    300],
      ['c1',      1100],
      ['agent',   1400],
      ['c2',      2200],
      ['surface', 2500],
      ['bracket', 3500],
    ];
    let timers = [];
    function clear() { timers.forEach(t => clearTimeout(t)); timers = []; }
    function run() {
      clear();
      Object.values(els).forEach(el => el && el.classList.remove('in'));
      order.forEach(([key, delay]) => {
        timers.push(setTimeout(() => els[key] && els[key].classList.add('in'), delay));
      });
    }
    document.getElementById('replay-btn').addEventListener('click', run);
    run();

    /* ---- surface liveness: ticking metric, sparkline, rail times ---- */
    const metricEl = document.getElementById('ca-metric');
    const deltaEl  = document.getElementById('ca-delta');
    const sparkEl  = document.getElementById('ca-spark');
    const row1 = document.getElementById('ca-row-1');
    const row2 = document.getElementById('ca-row-2');
    const row3 = document.getElementById('ca-row-3');

    let metric = 103.2;
    let delta  = 2.4;
    setInterval(() => {
      metric += (Math.random() - 0.48) * 0.35;
      delta  += (Math.random() - 0.50) * 0.18;
      if (metricEl) metricEl.textContent = `$${metric.toFixed(1)}k`;
      if (deltaEl)  deltaEl.textContent  = `${delta >= 0 ? '+' : ''}${delta.toFixed(1)}%`;
    }, 900);

    const sparkFill = document.getElementById('ca-spark-fill');
    const sparkCursor = document.getElementById('ca-spark-cursor');
    const SPARK_X0 = 236, SPARK_X1 = 448, SPARK_Y_BASE = 376, SPARK_AMP = 22, BASELINE_Y = 404, N = 36;
    const vals = [];
    let v = 0;
    for (let i = 0; i < N; i++) {
      v += (Math.random() - 0.5) * 9;
      v = Math.max(-SPARK_AMP, Math.min(SPARK_AMP, v));
      vals.push(v);
    }
    function drawSpark() {
      if (!sparkEl) return;
      const step = (SPARK_X1 - SPARK_X0) / (N - 1);
      const pts = vals.map((y, i) => `${SPARK_X0 + i * step},${SPARK_Y_BASE - y}`);
      sparkEl.setAttribute('points', pts.join(' '));
      if (sparkFill) {
        const fillPts = [`${SPARK_X0},${BASELINE_Y}`, ...pts, `${SPARK_X1},${BASELINE_Y}`];
        sparkFill.setAttribute('points', fillPts.join(' '));
      }
      if (sparkCursor) {
        const lastY = SPARK_Y_BASE - vals[vals.length - 1];
        sparkCursor.setAttribute('cy', lastY);
      }
    }
    drawSpark();
    setInterval(() => {
      vals.shift();
      const last = vals[vals.length - 1];
      const drift = -last * 0.04;
      let next = last + drift + (Math.random() - 0.5) * 11;
      next = Math.max(-SPARK_AMP, Math.min(SPARK_AMP, next));
      vals.push(next);
      drawSpark();
    }, 200);

    const times = [3, 12, 31];
    const rowEls = [row1, row2, row3];
    setInterval(() => {
      for (let i = 0; i < 3; i++) {
        times[i] += 1;
        if (rowEls[i]) rowEls[i].textContent = times[i] < 60 ? `${times[i]}s` : `${Math.floor(times[i]/60)}m`;
      }
    }, 1000);
  })();
</script>
</body>
</html>
