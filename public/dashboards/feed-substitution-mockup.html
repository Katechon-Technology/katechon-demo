<!DOCTYPE html>
<html class="blank-dashboard-root">
<head>
  <meta charset="UTF-8">
  <title>What Comes After the Feed — Katechon</title>
  <style>
    :root {
      --bg0: #040609;
      --bg1: #0d1117;
      --text: #f3f6f8;
      --muted: rgba(243,246,248,0.66);
      --soft: rgba(243,246,248,0.42);
      --accent: #00e87b;
      --accent2: #7de8ff;
      --accent3: #ffbf5f;
      --line: rgba(255,255,255,0.10);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    body {
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 14% 9%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 28%),
        radial-gradient(circle at 84% 16%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 26%),
        radial-gradient(circle at 50% 110%, color-mix(in srgb, var(--accent3) 12%, transparent), transparent 34%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 58%, #030405);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, black, transparent 82%);
      pointer-events: none;
    }

    /* ===== Blank-dashboard chrome (title + single stage) ===== */
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      padding: clamp(14px, 2.2vw, 26px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(12px, 2vw, 22px);
    }
    .topbar {
      min-width: 0;
      padding: 0;
    }
    h1 {
      margin: 0;
      max-width: min(980px, 100%);
      color: rgba(243,246,248,0.95);
      font-size: clamp(34px, 6vh, 76px);
      line-height: 0.96;
      letter-spacing: 0;
      text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .stage {
      position: relative;
      min-height: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, rgba(255,255,255,0.14));
      border-radius: 8px;
      background:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.020) 1px, transparent 1px),
        radial-gradient(circle at 24% 18%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 30%),
        radial-gradient(circle at 72% 74%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 34%),
        rgba(0,0,0,0.22);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
      box-shadow:
        0 24px 76px rgba(0,0,0,0.34),
        inset 0 0 64px rgba(255,255,255,0.025);
      isolation: isolate;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 12%, transparent 88%, rgba(0,0,0,0.24));
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    /* ===== Scene inside the stage: 2x2 substitution grid ===== */
    .scene {
      position: absolute;
      inset: clamp(20px, 2vw, 36px);
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto 1fr;
      column-gap: clamp(20px, 2.4vw, 40px);
      row-gap: clamp(12px, 1.6vw, 22px);
      min-height: 0;
    }

    .col-precedent { --accent: #7de8ff; }
    .col-repeat    { --accent: #00e87b; }

    .query {
      position: relative;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: clamp(15px, 1.3vw, 22px);
      letter-spacing: 0.02em;
      color: rgba(243,246,248,0.92);
      padding: 12px 16px;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
      border-radius: 8px;
      background: rgba(0,0,0,0.32);
      display: flex; align-items: center; gap: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .query::before {
      content: "›";
      color: var(--accent);
      font-size: 22px;
      flex-shrink: 0;
    }
    .query .key {
      position: absolute;
      top: -16px; left: 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10.5px; letter-spacing: 0.28em; text-transform: uppercase;
      color: color-mix(in srgb, var(--accent) 80%, transparent);
    }
    .q-precedent { grid-column: 1; grid-row: 1; }
    .q-repeat    { grid-column: 2; grid-row: 1; }

    .cell {
      position: relative;
      min-width: 0; min-height: 0;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, rgba(255,255,255,0.07));
      border-radius: 10px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 50%),
        rgba(0,0,0,0.32);
      box-shadow: inset 0 0 28px rgba(255,255,255,0.022);
      overflow: hidden;
      transition:
        opacity 520ms cubic-bezier(0.4, 0.02, 0.4, 1),
        filter 520ms ease,
        border-color 520ms ease,
        box-shadow 520ms ease;
    }
    .cell.is-future {
      opacity: 0.32;
      filter: saturate(0.42);
    }
    .cell.is-past {
      opacity: 0.5;
      filter: saturate(0.68);
    }
    .cell.is-active {
      opacity: 1;
      border-color: color-mix(in srgb, var(--accent) 52%, rgba(255,255,255,0.18));
      box-shadow:
        inset 0 0 32px rgba(0,232,123,0.06),
        0 0 24px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .query {
      transition: opacity 520ms ease, filter 520ms ease;
    }
    .query.is-future { opacity: 0.38; filter: saturate(0.5); }
    .query.is-past   { opacity: 0.6;  filter: saturate(0.78); }
    .query.is-active { opacity: 1; }
    .cell .brand {
      position: absolute; top: 10px; left: 14px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase;
      color: color-mix(in srgb, var(--accent) 80%, rgba(255,255,255,0.4));
      z-index: 4;
    }
    .c-google  { grid-column: 1; grid-row: 2; }
    .c-claude  { grid-column: 1; grid-row: 4; }
    .c-feed    { grid-column: 2; grid-row: 2; }
    .c-puzzle  { grid-column: 2; grid-row: 4; }

    .connector {
      display: grid; place-items: center;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: clamp(18px, 1.6vw, 26px);
      color: color-mix(in srgb, var(--accent) 55%, transparent);
      text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .ct-precedent { grid-column: 1; grid-row: 3; }
    .ct-repeat    { grid-column: 2; grid-row: 3; }

    /* ===== Google SERP ===== */
    .serp {
      position: absolute; inset: 0;
      padding: 36px 20px 18px;
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
    }
    .serp-row { padding-right: 40px; align-self: center; }
    .serp-url {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px; letter-spacing: 0.04em;
      color: rgba(243,246,248,0.32);
      margin-bottom: 5px;
    }
    .serp-title {
      height: 9px; width: 64%; max-width: 280px;
      background: linear-gradient(90deg, rgba(125,232,255,0.62), rgba(125,232,255,0.22));
      border-radius: 2px;
      margin-bottom: 5px;
    }
    .serp-snippet {
      height: 5px; width: 92%; max-width: 360px;
      background: rgba(255,255,255,0.16);
      border-radius: 2px;
    }

    /* ===== Claude answer ===== */
    .claude {
      position: absolute; inset: 0;
      padding: 38px 20px 20px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
    }
    .claude-bubble {
      border-left: 2px solid var(--accent);
      padding: 4px 0 4px 14px;
      align-self: center;
    }
    .claude-line {
      height: 7px;
      background: rgba(243,246,248,0.46);
      border-radius: 2px; margin-bottom: 8px;
    }
    .claude-line:last-child { margin-bottom: 0; }
    .claude-line.w95 { width: 92%; max-width: 360px; }
    .claude-line.w80 { width: 78%; max-width: 300px; }
    .claude-line.w65 { width: 62%; max-width: 240px; }
    .claude-pills {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-self: end;
    }
    .claude-pills span {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px; letter-spacing: 0.18em; text-transform: lowercase;
      padding: 5px 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
      border-radius: 4px;
      color: var(--accent);
      background: rgba(0,0,0,0.42);
    }

    /* ===== Scrolling feed ===== */
    .feed { position: absolute; inset: 0; overflow: hidden; }
    .feed-mask {
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
        rgba(5,8,10,0.95), rgba(5,8,10,0.55) 14%,
        transparent 22%, transparent 78%,
        rgba(5,8,10,0.55) 86%, rgba(5,8,10,0.95));
      z-index: 3;
    }
    .feed-scroller {
      position: absolute; inset: 0;
      padding: 8px 20px 8px;
      animation: feedScroll 26s linear infinite;
      will-change: transform;
    }
    @keyframes feedScroll {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }
    .feed-row {
      display: grid; grid-template-columns: 26px 1fr; gap: 12px;
      padding: 11px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.07);
    }
    .feed-av {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.16);
    }
    .feed-row.hot .feed-av { background: rgba(0,232,123,0.45); }
    .feed-row.alt .feed-av { background: rgba(125,232,255,0.32); }
    .feed-handle {
      height: 7px; width: 38%;
      background: rgba(255,255,255,0.32);
      border-radius: 2px; margin-bottom: 6px;
    }
    .feed-text {
      height: 5px;
      background: rgba(255,255,255,0.18);
      border-radius: 2px; margin-bottom: 4px;
    }
    .feed-text.w95 { width: 95%; }
    .feed-text.w80 { width: 80%; }
    .feed-text.w55 { width: 55%; }

    /* ===== Unsolved puzzle cell ===== */
    .puzzle {
      border-style: dashed;
      border-color: color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,0.06));
      background:
        repeating-linear-gradient(
          135deg,
          rgba(0,232,123,0.025) 0 14px,
          transparent 14px 28px
        ),
        rgba(0,0,0,0.28);
    }
    /* Escalation kicks in only once the puzzle becomes the active step.
       Cell effects rise to a peak around the middle, then decay back —
       leaving the centered `?` overlay as the only thing on screen. */
    .puzzle.has-escalation {
      z-index: 12;
      animation: puzzleRise 14s cubic-bezier(0.4, 0.02, 0.4, 1) forwards;
    }
    @keyframes puzzleRise {
      0% {
        box-shadow: inset 0 0 28px rgba(255,255,255,0.022);
        border-color: color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,0.06));
        transform: scale(1);
      }
      35% {
        border-color: color-mix(in srgb, var(--accent) 52%, rgba(255,255,255,0.14));
        box-shadow:
          inset 0 0 56px rgba(0,232,123,0.18),
          0 0 48px color-mix(in srgb, var(--accent) 22%, transparent),
          0 0 120px color-mix(in srgb, var(--accent) 12%, transparent);
        transform: scale(1.015);
      }
      55% {
        border-color: color-mix(in srgb, var(--accent) 64%, rgba(255,255,255,0.16));
        box-shadow:
          inset 0 0 84px rgba(0,232,123,0.26),
          0 0 96px color-mix(in srgb, var(--accent) 32%, transparent),
          0 0 220px color-mix(in srgb, var(--accent) 18%, transparent);
        transform: scale(1.022);
      }
      100% {
        border-color: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,0.05));
        box-shadow: inset 0 0 24px rgba(255,255,255,0.02);
        transform: scale(1);
      }
    }

    /* CRT scan line that creeps in over time */
    .puzzle::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        transparent 0 3px,
        rgba(0,232,123,0.04) 3px 4px
      );
      opacity: 0;
      z-index: 5;
    }
    .puzzle.has-escalation::before {
      animation: scanlinesIn 14s ease-out forwards;
    }
    @keyframes scanlinesIn {
      0%, 20% { opacity: 0; }
      45%     { opacity: 0.7; }
      80%     { opacity: 0.4; }
      100%    { opacity: 0; }
    }

    /* Sweeping scan beam */
    .puzzle::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      top: -2px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 65%, transparent);
      opacity: 0;
      z-index: 6;
    }
    .puzzle.has-escalation::after {
      animation:
        scanBeamIntro 14s ease-out forwards,
        scanBeamLoop 5.2s linear 4s 2;
    }
    @keyframes scanBeamIntro {
      0%, 22% { opacity: 0; }
      28%     { opacity: 0.85; }
      55%     { opacity: 0.7; }
      80%     { opacity: 0.3; }
      100%    { opacity: 0; }
    }
    @keyframes scanBeamLoop {
      0%   { top: -2px; }
      100% { top: 100%; }
    }

    .puzzle .brand {
      color: color-mix(in srgb, var(--accent) 60%, rgba(255,255,255,0.3));
    }
    .puzzle-hint {
      position: absolute; inset: 26px;
      display: grid; grid-template-rows: 20px 1fr 22px; gap: 12px;
      opacity: 0.16;
      filter: blur(2px);
    }
    .puzzle.has-escalation .puzzle-hint {
      animation: hintReveal 14s ease-out forwards;
    }
    @keyframes hintReveal {
      0%   { opacity: 0.16; filter: blur(2px); }
      40%  { opacity: 0.45; filter: blur(0.5px); }
      75%  { opacity: 0.25; filter: blur(1px); }
      100% { opacity: 0;    filter: blur(3px); }
    }
    .ph-strip {
      background: linear-gradient(90deg,
        rgba(0,232,123,0.55),
        rgba(0,232,123,0.12) 38%,
        rgba(125,232,255,0.32) 70%,
        rgba(0,232,123,0.05));
      border-radius: 3px;
    }
    .ph-stage {
      border-radius: 4px;
      background:
        radial-gradient(circle at 32% 42%, rgba(0,232,123,0.32), transparent 44%),
        radial-gradient(circle at 70% 60%, rgba(125,232,255,0.22), transparent 48%),
        rgba(0,0,0,0.3);
    }
    .ph-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .ph-actions span { background: rgba(0,232,123,0.28); border-radius: 3px; }

    .puzzle-mask {
      position: absolute; inset: 26px;
      border-radius: 6px;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(5,6,8,0.84) 70%);
      pointer-events: none;
    }
    .puzzle.has-escalation .puzzle-mask {
      animation: maskThin 14s ease-out forwards;
    }
    @keyframes maskThin {
      0%   { background: radial-gradient(ellipse at center, transparent 0%,  rgba(5,6,8,0.86) 70%); }
      45%  { background: radial-gradient(ellipse at center, transparent 36%, rgba(5,6,8,0.30) 96%); }
      100% { background: radial-gradient(ellipse at center, transparent 0%,  rgba(5,6,8,0.92) 60%); }
    }

    /* ===== Single `?` overlay — only one `?` exists, anywhere ===== */
    .puzzle-dominant {
      /* Spans the 4 cell-rows + both columns of the scene grid.
         place-items: center lands the wrapper at the geometric
         midpoint of the four cells. */
      grid-column: 1 / 3;
      grid-row: 2 / 5;
      align-self: stretch;
      justify-self: stretch;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 35;
      min-width: 0; min-height: 0;
    }

    /* The wrapper handles positional morph (translate only).
       JS measures the puzzle cell's center and sets --qcell-dx/dy
       so the wrapper sits inside the cell at rest. */
    .puzzle-q-wrap {
      display: inline-block;
      opacity: 0;
      transform: translate(var(--qcell-dx, 0px), var(--qcell-dy, 0px));
      transition: opacity 240ms ease;
    }
    .puzzle-q-wrap.is-ready { opacity: 1; }
    body.escalating .puzzle-q-wrap {
      animation: qMorph 14s cubic-bezier(0.4, 0.02, 0.4, 1) forwards;
    }
    @keyframes qMorph {
      0% {
        transform: translate(var(--qcell-dx, 0px), var(--qcell-dy, 0px));
      }
      55% {
        transform: translate(
          calc(var(--qcell-dx, 0px) * 0.35),
          calc(var(--qcell-dy, 0px) * 0.35 - 2vh)
        );
      }
      100% {
        /* Geometric center between the 4 cells, shifted up slightly
           to compensate for typographic bias + title weight above. */
        transform: translate(0px, -6vh);
      }
    }

    /* The glyph itself handles size, color, jitter, breathing, chromatic.
       Wrapped so its transforms (jitter) don't fight the wrapper's morph. */
    .puzzle-q-big {
      display: inline-block;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: clamp(64px, 8vw, 120px);
      font-weight: 700;
      line-height: 0.9;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 38%, transparent);
      will-change: transform, font-size, text-shadow;
    }
    body.escalating .puzzle-q-big {
      animation:
        qBigGrow 14s cubic-bezier(0.4, 0.02, 0.4, 1) forwards,
        qBreathe 2.8s ease-in-out 1.5s infinite,
        qChromatic 5.4s steps(1) 4s infinite,
        qJitter 7.3s steps(1) 8s infinite;
    }
    @keyframes qBigGrow {
      0%   { font-size: clamp(64px,  8vw, 120px); letter-spacing: 0.08em; }
      35%  { font-size: clamp(160px, 18vw, 300px); letter-spacing: 0.12em; }
      70%  { font-size: clamp(260px, 30vw, 480px); letter-spacing: 0.16em; }
      100% { font-size: clamp(340px, 38vw, 640px); letter-spacing: 0.20em; }
    }
    @keyframes qBreathe {
      0%, 100% { filter: brightness(1.0); }
      50%      { filter: brightness(1.28); }
    }
    /* periodic RGB-split */
    @keyframes qChromatic {
      0%, 92% {
        text-shadow: 0 0 44px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      93%, 94% {
        text-shadow:
          -3px 0 0 rgba(255,80,120,0.85),
          3px 0 0 rgba(125,232,255,0.85),
          0 0 44px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      95% {
        text-shadow:
          2px 1px 0 rgba(125,232,255,0.7),
          -2px -1px 0 rgba(255,80,120,0.7),
          0 0 44px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      96%, 100% {
        text-shadow: 0 0 44px color-mix(in srgb, var(--accent) 55%, transparent);
      }
    }
    /* occasional micro-jitter */
    @keyframes qJitter {
      0%, 95%, 100% { transform: translate(0, 0); }
      96%           { transform: translate(-2px, 1px); }
      97%           { transform: translate(2px, -1px); }
      98%           { transform: translate(-1px, 0); }
    }

    /* Title's question mark glows when the puzzle is escalating */
    h1 .q {
      display: inline-block;
      transition: color 600ms ease, text-shadow 600ms ease;
    }
    body.escalating h1 .q {
      color: var(--accent);
      text-shadow: 0 0 32px color-mix(in srgb, var(--accent) 60%, transparent);
    }
  </style>
</head>
<body class="blank-dashboard">
  <main class="app">
    <header class="topbar">
      <h1>What comes after the feed<span class="q">?</span></h1>
    </header>

    <div class="stage">
      <div class="scene">

        <div class="query col-precedent q-precedent">
          <span class="key">precedent</span>
          best italian in brooklyn
        </div>

        <div class="query col-repeat q-repeat">
          <span class="key">repeat</span>
          what's happening with the election tonight
        </div>

        <!-- Google SERP -->
        <div class="cell col-precedent c-google">
          <span class="brand">google</span>
          <div class="serp">
            <div class="serp-row">
              <div class="serp-url">tripadvisor.com</div>
              <div class="serp-title"></div>
              <div class="serp-snippet"></div>
            </div>
            <div class="serp-row">
              <div class="serp-url">eater.com</div>
              <div class="serp-title"></div>
              <div class="serp-snippet"></div>
            </div>
            <div class="serp-row">
              <div class="serp-url">reddit.com</div>
              <div class="serp-title"></div>
              <div class="serp-snippet"></div>
            </div>
            <div class="serp-row">
              <div class="serp-url">yelp.com</div>
              <div class="serp-title"></div>
              <div class="serp-snippet"></div>
            </div>
            <div class="serp-row">
              <div class="serp-url">nytimes.com</div>
              <div class="serp-title"></div>
              <div class="serp-snippet"></div>
            </div>
          </div>
        </div>

        <!-- Scrolling feed -->
        <div class="cell col-repeat c-feed">
          <span class="brand">the feed</span>
          <div class="feed">
            <div class="feed-mask"></div>
            <div class="feed-scroller" id="feed-scroller"></div>
          </div>
        </div>

        <!-- Connectors -->
        <div class="connector col-precedent ct-precedent">↓</div>
        <div class="connector col-repeat ct-repeat">↓</div>

        <!-- Claude answer -->
        <div class="cell col-precedent c-claude">
          <span class="brand">claude</span>
          <div class="claude">
            <div class="claude-bubble">
              <div class="claude-line w95"></div>
              <div class="claude-line w80"></div>
              <div class="claude-line w95"></div>
              <div class="claude-line w65"></div>
            </div>
            <div class="claude-pills">
              <span>misi</span><span>lilia</span><span>l'industrie</span>
            </div>
          </div>
        </div>

        <!-- Unsolved puzzle cell (no `?` here — the single `?` lives in the overlay) -->
        <div class="cell puzzle col-repeat c-puzzle">
          <span class="brand">?</span>
          <div class="puzzle-hint">
            <div class="ph-strip"></div>
            <div class="ph-stage"></div>
            <div class="ph-actions"><span></span><span></span><span></span></div>
          </div>
          <div class="puzzle-mask"></div>
        </div>

        <!-- The single `?` glyph. Lives at scene-center in DOM, but a JS-
             measured transform parks it inside the puzzle cell during
             states 0–2. When escalation begins, the transform animates
             back to scene-center (slightly above geometric mid) while
             font-size grows. Same element throughout. -->
        <div class="puzzle-dominant" aria-hidden="true">
          <div class="puzzle-q-wrap">
            <span class="puzzle-q-big">?</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    (function () {
      const scroller = document.getElementById("feed-scroller");
      if (!scroller) return;
      const rows = [
        { kind: "hot", t: ["w95","w80"] },
        { kind: "",    t: ["w95","w55"] },
        { kind: "alt", t: ["w80","w95","w55"] },
        { kind: "hot", t: ["w95"] },
        { kind: "",    t: ["w80","w55"] },
        { kind: "alt", t: ["w95","w80"] },
        { kind: "hot", t: ["w95","w55"] },
        { kind: "",    t: ["w80"] },
        { kind: "alt", t: ["w95","w80","w55"] },
        { kind: "hot", t: ["w95"] },
        { kind: "",    t: ["w80","w55"] },
        { kind: "alt", t: ["w95","w80"] },
      ];
      function row(r) {
        const k = r.kind ? `feed-row ${r.kind}` : "feed-row";
        const t = r.t.map((w) => `<div class="feed-text ${w}"></div>`).join("");
        return `<div class="${k}"><div class="feed-av"></div><div class="feed-body"><div class="feed-handle"></div>${t}</div></div>`;
      }
      const html = rows.map(row).join("");
      scroller.innerHTML = html + html;
    })();

    // ===== Click-through state machine =====
    (function () {
      const cells = [
        document.querySelector(".c-google"),
        document.querySelector(".c-claude"),
        document.querySelector(".c-feed"),
        document.querySelector(".c-puzzle"),
      ];
      const qPrec = document.querySelector(".q-precedent");
      const qRep  = document.querySelector(".q-repeat");
      const puzzle  = document.querySelector(".c-puzzle");
      const qGlyph  = document.querySelector(".puzzle-q-big");
      const qWrap   = document.querySelector(".puzzle-q-wrap");
      const overlay = document.querySelector(".puzzle-dominant");
      let state = 0;
      let scrambleTimer = null;

      // Measure where the puzzle cell's center sits relative to the
      // overlay's natural center (scene-center). The wrapper uses these
      // as CSS custom properties to translate into the cell at rest.
      function syncOffset() {
        if (!puzzle || !overlay || !qWrap) return;
        const cellR    = puzzle.getBoundingClientRect();
        const overlayR = overlay.getBoundingClientRect();
        const dx = (cellR.left + cellR.width / 2) -
                   (overlayR.left + overlayR.width / 2);
        const dy = (cellR.top + cellR.height / 2) -
                   (overlayR.top + overlayR.height / 2);
        document.documentElement.style.setProperty("--qcell-dx", dx + "px");
        document.documentElement.style.setProperty("--qcell-dy", dy + "px");
        qWrap.classList.add("is-ready");
      }
      window.addEventListener("resize", syncOffset);
      window.addEventListener("load", syncOffset);
      // run once on the next paint frame so layout is settled
      requestAnimationFrame(() => requestAnimationFrame(syncOffset));

      function applyStep(el, idx, step) {
        if (!el) return;
        el.classList.remove("is-future", "is-active", "is-past");
        if (step == null) return;
        if (idx < step) el.classList.add("is-past");
        else if (idx === step) el.classList.add("is-active");
        else el.classList.add("is-future");
      }

      function setState(n) {
        state = Math.max(0, Math.min(3, n));
        cells.forEach((cell, i) => applyStep(cell, i, state));

        // Queries follow their column's first cell
        // Precedent col: revealed when state >= 0 (always at least "active")
        // Repeat col:    future when state < 2, active at 2, past at 3
        qPrec.classList.remove("is-future", "is-active", "is-past");
        qRep.classList.remove("is-future", "is-active", "is-past");
        if (state < 1) qPrec.classList.add("is-active");
        else qPrec.classList.add("is-past");
        if (state < 2)      qRep.classList.add("is-future");
        else if (state < 3) qRep.classList.add("is-active");
        else                qRep.classList.add("is-past");

        // Escalation only at step 3
        if (state === 3) {
          puzzle.classList.add("has-escalation");
          document.body.classList.add("escalating");
          startScramble();
        } else {
          puzzle.classList.remove("has-escalation");
          document.body.classList.remove("escalating");
          stopScramble();
          qGlyph.textContent = "?";
        }
      }

      // ===== Scramble (only runs during escalation) =====
      const glyphs = ["█","▓","▒","░","◢","◣","╳","┼","║","═","Σ","Δ","Φ","λ","Ω","*","#"];
      let scrambling = false;
      function scrambleOnce() {
        if (scrambling || !puzzle.classList.contains("has-escalation")) return;
        scrambling = true;
        const steps = 7 + Math.floor(Math.random() * 4);
        let i = 0;
        const tick = () => {
          if (!puzzle.classList.contains("has-escalation")) {
            qGlyph.textContent = "?";
            scrambling = false;
            return;
          }
          if (i >= steps) {
            qGlyph.textContent = "?";
            scrambling = false;
            return;
          }
          qGlyph.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          i += 1;
          setTimeout(tick, 38 + Math.random() * 30);
        };
        tick();
      }
      function startScramble() {
        stopScramble();
        const loop = () => {
          if (!puzzle.classList.contains("has-escalation")) return;
          scrambleOnce();
          scrambleTimer = setTimeout(loop, 6000 + Math.random() * 3000);
        };
        scrambleTimer = setTimeout(loop, 5200);
      }
      function stopScramble() {
        if (scrambleTimer) { clearTimeout(scrambleTimer); scrambleTimer = null; }
      }

      function next() { setState(state + 1); }
      function prev() { setState(state - 1); }

      document.addEventListener("keydown", (e) => {
        if (e.target?.isContentEditable) return;
        const tag = e.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault(); next();
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault(); prev();
        }
      });
      document.body.addEventListener("click", (e) => {
        // shift+click reverses
        if (e.shiftKey) prev(); else next();
      });

      setState(0);
    })();
  </script>
</body>
</html>
