<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Katechon — Mythos Ban capture stage</title>
<style>
  :root { --coral: #cc785c; --cyan: #7de8ff; }
  html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; background: #04060a; }

  /* The bounded reel is scaled down toward the left (no internal reflow),
     leaving a clear right column for Kat — mirrors the deck composition:
     bounded screen + Kat beside it, never over the data. */
  #reel {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: block;
    transform: scale(0.78); transform-origin: 0% 50%;
  }

  /* Kat — the actual transparent Live2D avatar, lower-right, inside the screen. */
  #avatar-wrap {
    position: absolute; right: 0; bottom: 0; width: 22%; height: 82%;
    z-index: 30; pointer-events: none; opacity: 1;
    transition: opacity 260ms ease;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.6));
  }
  /* Soft scrim under Kat so she reads as placed in the corner, not floating. */
  #avatar-wrap::before {
    content: ""; position: absolute; inset: -6% -4% 0 -4%; z-index: -1;
    background: radial-gradient(120% 80% at 70% 100%, rgba(4,6,10,0.55), transparent 70%);
  }
  #avatar { width: 100%; height: 100%; border: 0; background: transparent; }
  body.brand #avatar-wrap { opacity: 0; }

  /* Matrix rebuild veil — flashed on every generated-state transition. */
  #veil {
    position: absolute; inset: 0; z-index: 40; pointer-events: none;
    opacity: 0; transition: opacity 140ms ease;
    background:
      repeating-linear-gradient(0deg, rgba(125,232,255,0.10) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(204,120,92,0.08) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 50% 50%, rgba(204,120,92,0.18), rgba(4,6,10,0.86) 70%);
  }
  #veil.active { opacity: 1; animation: veil-sweep 560ms ease; }
  @keyframes veil-sweep {
    0% { opacity: 0; clip-path: inset(0 0 100% 0); }
    35% { opacity: 1; clip-path: inset(0 0 0 0); }
    100% { opacity: 0; clip-path: inset(0 0 0 0); }
  }
  #veil .veil-label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font: 600 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 14px rgba(125,232,255,0.55);
    border: 1px solid rgba(204,120,92,0.5); padding: 10px 18px;
    background: rgba(4,6,10,0.55); white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <iframe id="reel" src="/dashboards/mythos-ban/" allow="autoplay"></iframe>
    <div id="veil"><div class="veil-label"></div></div>
    <div id="avatar-wrap">
      <iframe id="avatar" src="/avatar-pet.html?model=0&xFactor=0.8&v=8" allow="autoplay"></iframe>
    </div>
  </div>

  <script>
    const avatar = document.getElementById('avatar');
    const veil = document.getElementById('veil');
    const veilLabel = veil.querySelector('.veil-label');

    // Unlock the avatar's audio context as soon as it's ready (no user gesture
    // in the capture; Chromium launches with autoplay allowed).
    function unlockAvatar() { try { avatar.contentWindow.postMessage({ type: 'unlock' }, '*'); } catch (e) {} }
    avatar.addEventListener('load', () => { unlockAvatar(); setTimeout(unlockAvatar, 800); });

    let veilTimer = null;
    function flashVeil(label) {
      veilLabel.textContent = 'REBUILDING · ' + String(label || 'channel').toUpperCase();
      veil.classList.remove('active');
      // force reflow so the animation restarts on rapid transitions
      void veil.offsetWidth;
      veil.classList.add('active');
      clearTimeout(veilTimer);
      veilTimer = setTimeout(() => veil.classList.remove('active'), 560);
    }

    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (!d || typeof d !== 'object') return;
      switch (d.type) {
        case 'seed-channel-speak':
          // Kat lines arrive with audio -> hand to the avatar (play + lip-sync).
          if (d.audio) {
            try { avatar.contentWindow.postMessage({ type: 'audio', id: d.id, text: d.text, audio: d.audio }, '*'); } catch (_) {}
          }
          break;
        case 'seed-channel-build-transition':
          flashVeil(d.label || d.scene || d.channelLabel || 'channel');
          break;
        case 'seed-channel-brand':
          document.body.classList.toggle('brand', Boolean(d.active));
          break;
        default:
          break;
      }
    });
  </script>
</body>
</html>
