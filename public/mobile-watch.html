<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- MOBILE_WATCH_META -->
  <style>
    :root {
      --bg: #030506;
      --text: #f4f7f5;
      --muted: rgba(244,247,245,0.64);
      --soft: rgba(244,247,245,0.38);
      --line: rgba(255,255,255,0.14);
      --panel: rgba(3,5,6,0.62);
      --accent: #00e87b;
      --accent2: #7de8ff;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
    }

    .watch {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 12%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 28%),
        radial-gradient(circle at 78% 18%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 24%),
        linear-gradient(145deg, #020303, var(--bg) 56%, #050707);
      isolation: isolate;
    }
    .watch::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), transparent 16%, transparent 69%, rgba(0,0,0,0.58)),
        linear-gradient(90deg, rgba(0,0,0,0.18), transparent 30%, transparent 72%, rgba(0,0,0,0.20));
    }
    .watch::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.82), rgba(0,0,0,0.22) 42%, rgba(0,0,0,0.78));
    }

    .dashboard-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .dashboard-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #050608;
      transform: scale(1.015);
      transform-origin: center;
      opacity: 0;
      transition: opacity 420ms ease, filter 420ms ease, transform 600ms cubic-bezier(0.16, 1, 0.3, 1);
      filter: saturate(1.12) contrast(1.04) brightness(0.94);
    }
    .dashboard-frame.ready {
      opacity: 1;
      transform: scale(1);
    }

    .scan {
      position: absolute;
      left: -10%;
      right: -10%;
      top: 0;
      z-index: 6;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent);
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent2) 45%, transparent);
      opacity: 0.74;
      animation: scan 4.8s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      from { transform: translateY(-12vh); }
      to { transform: translateY(112vh); }
    }

    .top-strip {
      position: absolute;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      z-index: 12;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .channel-meta {
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .eyebrow,
    .timer,
    .caption-kicker,
    .end-kicker {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 10px;
      text-shadow: 0 1px 10px rgba(0,0,0,0.62);
    }
    h1 {
      margin: 0;
      max-width: 70vw;
      font-size: 32px;
      line-height: 0.94;
      letter-spacing: 0;
      text-shadow: 0 2px 18px rgba(0,0,0,0.74);
      overflow-wrap: anywhere;
    }
    .timer {
      flex-shrink: 0;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      background: rgba(0,0,0,0.34);
      color: rgba(244,247,245,0.72);
      font-size: 10px;
      backdrop-filter: blur(12px);
    }

    .bumper {
      position: absolute;
      inset: 0;
      z-index: 18;
      display: grid;
      place-items: center;
      padding: 26px;
      background: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 15%, transparent), rgba(0,0,0,0.84) 62%);
      opacity: 0;
      pointer-events: none;
      transform: scale(1.025);
      transition: opacity 360ms ease, transform 520ms ease;
    }
    .bumper.visible {
      opacity: 1;
      transform: scale(1);
    }
    .bumper-card {
      width: min(88vw, 410px);
      display: grid;
      gap: 12px;
      text-align: center;
    }
    .pulse-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 6px;
      border: 1px solid color-mix(in srgb, var(--accent) 72%, white);
      border-radius: 50%;
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 34%, transparent), inset 0 0 24px rgba(255,255,255,0.05);
      position: relative;
    }
    .pulse-mark::before,
    .pulse-mark::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid color-mix(in srgb, var(--accent2) 58%, white);
      border-radius: 50%;
      animation: pulse 1100ms ease-out infinite;
    }
    .pulse-mark::after {
      inset: 17px;
      animation-delay: 260ms;
    }
    @keyframes pulse {
      from { transform: scale(0.7); opacity: 1; }
      to { transform: scale(1.9); opacity: 0; }
    }
    .bumper-title {
      margin: 0;
      font-size: 46px;
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }
    .bumper-status {
      color: var(--muted);
      font: 11px/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .avatar-host {
      position: absolute;
      right: -8px;
      bottom: calc(170px + env(safe-area-inset-bottom));
      z-index: 13;
      width: 118px;
      height: 210px;
      pointer-events: none;
      overflow: hidden;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,0.45));
    }
    .avatar-host iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .control-deck {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 14;
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 8px;
      background: rgba(0,0,0,0.54);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 48px rgba(0,0,0,0.38);
    }
    .progress-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 50%, transparent);
      transition: width 140ms linear;
    }
    .caption-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }
    .caption-box {
      min-width: 0;
      padding-right: 0;
    }
    .caption-kicker {
      margin-bottom: 4px;
      color: var(--accent2);
      font-size: 9px;
    }
    .caption {
      min-height: 40px;
      color: rgba(244,247,245,0.88);
      font-size: 14px;
      line-height: 1.35;
      text-shadow: 0 1px 10px rgba(0,0,0,0.72);
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      gap: 7px;
      align-items: center;
      padding-bottom: 1px;
    }
    .round-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .share-btn {
      width: auto;
      min-width: 58px;
      height: 38px;
      padding: 0 13px;
      color: rgba(244,247,245,0.78);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .play-icon,
    .pause-icon,
    .mute-icon,
    .sound-icon {
      display: block;
      position: relative;
    }
    .play-icon {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid currentColor;
    }
    .pause-icon {
      width: 15px;
      height: 17px;
      border-left: 5px solid currentColor;
      border-right: 5px solid currentColor;
    }
    .sound-icon,
    .mute-icon {
      width: 18px;
      height: 16px;
      border-left: 7px solid currentColor;
    }
    .sound-icon::before,
    .mute-icon::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 3px;
      width: 9px;
      height: 10px;
      border: 2px solid currentColor;
      border-left: 0;
      border-radius: 0 12px 12px 0;
    }
    .mute-icon::after {
      content: "";
      position: absolute;
      left: -4px;
      top: 7px;
      width: 25px;
      height: 2px;
      background: currentColor;
      transform: rotate(-35deg);
      transform-origin: center;
    }

    .tap-layer,
    .end-layer {
      position: absolute;
      inset: 0;
      z-index: 22;
      display: grid;
      place-items: center;
      padding: 22px;
      background: radial-gradient(circle at 50% 48%, rgba(0,0,0,0.34), rgba(0,0,0,0.76));
      transition: opacity 220ms ease;
    }
    .tap-layer {
      place-items: end center;
      padding-bottom: calc(126px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.28) 58%, rgba(0,0,0,0.68));
      pointer-events: none;
    }
    .tap-layer.hidden,
    .end-layer.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .tap-card,
    .end-card {
      width: min(88vw, 390px);
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,0.46);
    }
    .tap-card {
      pointer-events: auto;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }
    .tap-card .tap-title {
      font-size: 23px;
      line-height: 1;
    }
    .tap-title,
    .end-title {
      margin: 0;
      font-size: 34px;
      line-height: 0.95;
      letter-spacing: 0;
    }
    .tap-copy,
    .end-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }
    .tap-card .tap-copy { display: none; }
    .tap-main,
    .end-actions button {
      min-height: 44px;
      border-radius: 999px;
      color: #031008;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-color: transparent;
      font-weight: 760;
    }
    .end-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .end-actions button {
      color: rgba(244,247,245,0.86);
      background: rgba(255,255,255,0.08);
      border-color: var(--line);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .end-actions .primary {
      color: #031008;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-color: transparent;
    }

    .swipe-hit {
      position: absolute;
      top: 19%;
      bottom: 22%;
      width: 22%;
      z-index: 8;
      border: 0;
      opacity: 0;
      padding: 0;
    }
    .swipe-hit.prev { left: 0; }
    .swipe-hit.next { right: 0; }

    @media (min-width: 700px) {
      .watch {
        width: min(430px, 100vw);
        height: min(932px, 100vh);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-left: 1px solid rgba(255,255,255,0.12);
        border-right: 1px solid rgba(255,255,255,0.12);
      }
      body { background: #030404; }
    }

    @media (min-width: 390px) {
      .avatar-host {
        width: 130px;
        height: 232px;
        bottom: calc(182px + env(safe-area-inset-bottom));
      }
    }

    @media (min-width: 420px) {
      .avatar-host {
        width: 142px;
        height: 254px;
        bottom: calc(190px + env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 370px) {
      h1 { font-size: 30px; }
      .bumper-title { font-size: 42px; }
      .tap-title,
      .end-title { font-size: 32px; }
      .tap-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="watch" id="watch">
    <section class="dashboard-stage" aria-label="Dashboard watch surface">
      <iframe id="dashboard-frame" class="dashboard-frame" title="Katechon dashboard" allow="autoplay; fullscreen"></iframe>
    </section>
    <div class="scan" aria-hidden="true"></div>

    <header class="top-strip">
      <div class="channel-meta">
        <div class="eyebrow" id="channel-eyebrow">Katechon Watch</div>
        <h1 id="channel-title">Dashboard Channel</h1>
      </div>
      <div class="timer" id="timer">00:00</div>
    </header>

    <section class="bumper visible" id="bumper" aria-hidden="true">
      <div class="bumper-card">
        <div class="pulse-mark"></div>
        <h2 class="bumper-title" id="bumper-title">Channel</h2>
        <div class="bumper-status" id="bumper-status">status pulse / episode loading</div>
      </div>
    </section>

    <aside class="avatar-host" aria-hidden="true">
      <iframe id="avatar-frame" src="/avatar-pet.html?model=0&w=360&h=640" title="Kat host" allow="autoplay"></iframe>
    </aside>

    <section class="control-deck" aria-label="Episode controls">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="caption-row">
        <div class="caption-box">
          <div class="caption-kicker" id="caption-kicker">Kat narration</div>
          <div class="caption" id="caption">Loading channel.</div>
        </div>
        <div class="actions">
          <button class="round-btn" id="play-button" type="button" aria-label="Pause episode"><span class="pause-icon" aria-hidden="true"></span></button>
          <button class="round-btn" id="mute-button" type="button" aria-label="Mute narration"><span class="sound-icon" aria-hidden="true"></span></button>
          <button class="share-btn" id="share-button" type="button">Share</button>
        </div>
      </div>
    </section>

    <button class="swipe-hit prev" id="prev-hit" type="button" aria-label="Previous channel"></button>
    <button class="swipe-hit next" id="next-hit" type="button" aria-label="Next channel"></button>

    <section class="tap-layer" id="tap-layer">
      <div class="tap-card">
        <h2 class="tap-title" id="tap-title">Watch This Dashboard</h2>
        <p class="tap-copy" id="tap-copy">A narrated one-minute Katechon channel is ready.</p>
        <button class="tap-main" id="tap-main" type="button">Play Episode</button>
      </div>
    </section>

    <section class="end-layer hidden" id="end-layer" aria-live="polite">
      <div class="end-card">
        <div class="end-kicker">Episode complete</div>
        <h2 class="end-title" id="end-title">Channel wrapped.</h2>
        <p class="end-copy" id="end-copy">Replay this dashboard or move to the next Katechon channel.</p>
        <div class="end-actions">
          <button id="replay-button" type="button">Replay</button>
          <button id="end-share-button" type="button">Share</button>
          <button id="end-next-button" class="primary" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.__MOBILE_DASHBOARD__ = window.__MOBILE_DASHBOARD__ || null;
  </script>
  <!-- MOBILE_WATCH_BOOTSTRAP -->
  <script>
    const episodeState = {
      data: window.__MOBILE_DASHBOARD__,
      started: false,
      paused: false,
      muted: false,
      ended: false,
      startTime: 0,
      pausedAt: 0,
      elapsedWhenPaused: 0,
      currentSegment: -1,
      speech: null,
      raf: 0,
      touchStartX: 0,
      touchStartY: 0,
      touchStartAt: 0,
    };

    const $ = (id) => document.getElementById(id);
    const frame = $("dashboard-frame");
    const avatar = $("avatar-frame");
    const playButton = $("play-button");
    const muteButton = $("mute-button");
    const shareButton = $("share-button");
    const endShareButton = $("end-share-button");
    const replayButton = $("replay-button");
    const endNextButton = $("end-next-button");
    const tapLayer = $("tap-layer");
    const endLayer = $("end-layer");
    const bumper = $("bumper");
    const progressFill = $("progress-fill");
    const caption = $("caption");
    const timer = $("timer");

    function iconButton(button, type) {
      button.innerHTML = `<span class="${type}-icon" aria-hidden="true"></span>`;
    }

    function safeFetchJson(url) {
      return fetch(url, { cache: "no-store" }).then(async (resp) => {
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(payload.error || `request failed (${resp.status})`);
        return payload;
      });
    }

    function dashboardSlugFromPath() {
      const match = location.pathname.match(/^\/watch\/([^/?#]+)/);
      return match ? decodeURIComponent(match[1]) : "spectre";
    }

    function applyTheme(data) {
      document.documentElement.style.setProperty("--accent", data.accent || "#00e87b");
      document.documentElement.style.setProperty("--accent2", data.accent2 || "#7de8ff");
      document.documentElement.style.setProperty("--bg", data.bg || "#030506");
    }

    function hydrate(data) {
      episodeState.data = data;
      applyTheme(data);
      document.title = `${data.title} - Katechon Watch`;
      $("channel-eyebrow").textContent = data.channel || "Katechon Watch";
      $("channel-title").textContent = data.title;
      $("bumper-title").textContent = data.label;
      $("bumper-status").textContent = data.bumper || "status pulse / channel live";
      $("caption-kicker").textContent = data.host || "Kat narration";
      $("caption").textContent = data.script?.[0]?.text || data.description || "Dashboard online.";
      $("tap-title").textContent = data.tapTitle || `Watch ${data.label}`;
      $("tap-copy").textContent = data.description || "A narrated Katechon dashboard channel is ready.";
      $("end-title").textContent = data.endTitle || `${data.label} wrapped.`;
      $("end-copy").textContent = data.endCopy || "Replay this dashboard or move to the next Katechon channel.";
      frame.title = data.label;
      frame.src = data.route;
      setTimeout(() => bumper.classList.remove("visible"), 1900);
    }

    async function loadEpisode() {
      if (episodeState.data) {
        hydrate(episodeState.data);
        return;
      }
      const payload = await safeFetchJson(`/api/mobile-episode/${encodeURIComponent(dashboardSlugFromPath())}`);
      hydrate(payload);
    }

    function postToAvatar(message) {
      avatar.contentWindow?.postMessage(message, "*");
    }

    function unlockAvatar() {
      postToAvatar({ type: "unlock" });
      postToAvatar({ type: "tune", scale: 0.62, yFactor: 1.34 });
    }

    window.addEventListener("message", (event) => {
      if (!event.data) return;
      if (event.data.type === "avatar-ready") {
        postToAvatar({ type: "tune", scale: 0.62, yFactor: 1.34 });
      }
    });

    frame.addEventListener("load", () => {
      frame.classList.add("ready");
    });

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    function episodeDuration() {
      return Number(episodeState.data?.durationMs || 60000);
    }

    function elapsedMs() {
      if (!episodeState.started) return 0;
      if (episodeState.paused) return episodeState.elapsedWhenPaused;
      return episodeState.elapsedWhenPaused + performance.now() - episodeState.startTime;
    }

    function setPlayingUi() {
      iconButton(playButton, episodeState.paused || !episodeState.started || episodeState.ended ? "play" : "pause");
      playButton.setAttribute("aria-label", episodeState.paused || episodeState.ended ? "Play episode" : "Pause episode");
      iconButton(muteButton, episodeState.muted ? "mute" : "sound");
      muteButton.setAttribute("aria-label", episodeState.muted ? "Unmute narration" : "Mute narration");
    }

    function segmentFor(ms) {
      const script = episodeState.data?.script || [];
      let index = 0;
      for (let i = 0; i < script.length; i += 1) {
        if (ms >= Number(script[i].atMs || 0)) index = i;
      }
      return index;
    }

    function cancelSpeech() {
      if (!window.speechSynthesis) return;
      try { window.speechSynthesis.cancel(); } catch (_) {}
      episodeState.speech = null;
      postToAvatar({ type: "stop" });
    }

    function speakSegment(index) {
      const segment = episodeState.data?.script?.[index];
      if (!segment) return;
      caption.textContent = segment.text;
      if (episodeState.muted || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
      cancelSpeech();
      const utterance = new SpeechSynthesisUtterance(segment.text);
      utterance.rate = Number(segment.rate || 0.96);
      utterance.pitch = 1.04;
      utterance.volume = 0.88;
      episodeState.speech = utterance;
      try {
        window.speechSynthesis.speak(utterance);
        postToAvatar({ type: "unlock" });
      } catch (_) {}
    }

    function endEpisode() {
      episodeState.ended = true;
      episodeState.paused = false;
      cancelSpeech();
      cancelAnimationFrame(episodeState.raf);
      progressFill.style.width = "100%";
      timer.textContent = formatTime(episodeDuration());
      endLayer.classList.remove("hidden");
      setPlayingUi();
    }

    function tick() {
      const duration = episodeDuration();
      const elapsed = Math.min(duration, elapsedMs());
      progressFill.style.width = `${Math.round((elapsed / duration) * 1000) / 10}%`;
      timer.textContent = formatTime(elapsed);

      const segmentIndex = segmentFor(elapsed);
      if (segmentIndex !== episodeState.currentSegment) {
        episodeState.currentSegment = segmentIndex;
        speakSegment(segmentIndex);
      }

      if (elapsed >= duration) {
        endEpisode();
        return;
      }
      episodeState.raf = requestAnimationFrame(tick);
    }

    function beginEpisode(fromGesture = false) {
      if (!episodeState.data) return;
      unlockAvatar();
      tapLayer.classList.add("hidden");
      endLayer.classList.add("hidden");
      episodeState.started = true;
      episodeState.paused = false;
      episodeState.ended = false;
      episodeState.elapsedWhenPaused = 0;
      episodeState.currentSegment = -1;
      episodeState.startTime = performance.now();
      cancelSpeech();
      setPlayingUi();
      cancelAnimationFrame(episodeState.raf);
      episodeState.raf = requestAnimationFrame(tick);

      if (!fromGesture && window.speechSynthesis) {
        setTimeout(() => {
          if (!episodeState.started || episodeState.paused || episodeState.muted) return;
          if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
          tapLayer.classList.remove("hidden");
        }, 550);
      }
    }

    function pauseEpisode() {
      if (!episodeState.started || episodeState.paused) return;
      episodeState.paused = true;
      episodeState.elapsedWhenPaused = elapsedMs();
      cancelAnimationFrame(episodeState.raf);
      cancelSpeech();
      setPlayingUi();
    }

    function resumeEpisode() {
      if (episodeState.ended) {
        beginEpisode(true);
        return;
      }
      if (!episodeState.started) {
        beginEpisode(true);
        return;
      }
      if (!episodeState.paused) return;
      unlockAvatar();
      episodeState.paused = false;
      episodeState.startTime = performance.now();
      episodeState.currentSegment = -1;
      setPlayingUi();
      episodeState.raf = requestAnimationFrame(tick);
    }

    function togglePlay() {
      if (!episodeState.started || episodeState.paused || episodeState.ended) resumeEpisode();
      else pauseEpisode();
    }

    function toggleMute() {
      episodeState.muted = !episodeState.muted;
      if (episodeState.muted) cancelSpeech();
      else episodeState.currentSegment = -1;
      setPlayingUi();
    }

    function goToChannel(direction) {
      const target = direction < 0 ? episodeState.data?.previous?.slug : episodeState.data?.next?.slug;
      if (!target) return;
      location.href = `/watch/${encodeURIComponent(target)}`;
    }

    async function shareEpisode() {
      const data = episodeState.data;
      const url = new URL(data.watchPath || location.pathname, location.origin).href;
      const title = data.shareTitle || `${data.label} - Katechon Watch`;
      const text = data.description || "Watch this Katechon dashboard.";
      if (navigator.share) {
        try {
          await navigator.share({ title, text, url });
          return;
        } catch (_) {}
      }
      try {
        await navigator.clipboard.writeText(url);
        shareButton.textContent = "Copied";
        setTimeout(() => { shareButton.textContent = "Share"; }, 1200);
      } catch (_) {
        location.href = url;
      }
    }

    playButton.addEventListener("click", togglePlay);
    muteButton.addEventListener("click", toggleMute);
    shareButton.addEventListener("click", shareEpisode);
    endShareButton.addEventListener("click", shareEpisode);
    replayButton.addEventListener("click", () => beginEpisode(true));
    endNextButton.addEventListener("click", () => goToChannel(1));
    $("tap-main").addEventListener("click", () => beginEpisode(true));
    $("prev-hit").addEventListener("click", () => goToChannel(-1));
    $("next-hit").addEventListener("click", () => goToChannel(1));

    window.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      episodeState.touchStartX = touch.clientX;
      episodeState.touchStartY = touch.clientY;
      episodeState.touchStartAt = performance.now();
    }, { passive: true });
    window.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - episodeState.touchStartX;
      const dy = touch.clientY - episodeState.touchStartY;
      const dt = performance.now() - episodeState.touchStartAt;
      if (dt > 700 || Math.abs(dx) < 58 || Math.abs(dx) < Math.abs(dy) * 1.35) return;
      goToChannel(dx < 0 ? 1 : -1);
    }, { passive: true });

    setPlayingUi();
    loadEpisode()
      .then(() => {
        setTimeout(() => beginEpisode(false), 520);
      })
      .catch((err) => {
        caption.textContent = err.message || "Channel unavailable.";
        tapLayer.classList.remove("hidden");
      });
  </script>
</body>
</html>
