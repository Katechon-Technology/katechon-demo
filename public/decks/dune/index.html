<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Katechon Technology</title>
  <meta name="description" content="Katechon Technology pitch cut for Dune Ventures.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="brand-anchor" href="https://katechon.technology" target="_blank" rel="noopener" aria-label="Katechon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="kt-anchor-shell" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#10161a"/>
          <stop offset="1" stop-color="#080b0d"/>
        </linearGradient>
        <linearGradient id="kt-anchor-signal" x1="23" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#7de8ff"/>
          <stop offset="0.42" stop-color="#00e87b"/>
          <stop offset="1" stop-color="#00c466"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#kt-anchor-shell)"/>
      <rect x="14" y="12" width="10" height="40" rx="3" fill="#f2f4f7"/>
      <path d="M31 12h12L27 32l16 20H31L15 32 31 12Z" fill="url(#kt-anchor-signal)"/>
      <rect x="10" y="20" width="3" height="24" rx="1.5" fill="#00e87b"/>
    </svg>
    <span class="brand-anchor-word">KATECHON</span>
  </a>

  <main class="deck" id="deck" aria-live="polite">
    <section class="empty-deck-state" id="empty-deck-state" aria-label="Realtime slide generation is ready">
      <p>Realtime slide generation</p>
      <h1>Ask for slide one.</h1>
      <span>OpenAI + repo context + Open Slide React page output</span>
    </section>
    <div class="motion-field" aria-hidden="true">
      <span class="vector vector-a"></span>
      <span class="vector vector-b"></span>
      <span class="vector vector-c"></span>
      <span class="pulse-node node-a"></span>
      <span class="pulse-node node-b"></span>
      <span class="pulse-node node-c"></span>
      <span class="pulse-node node-d"></span>
      <span class="narration-wave wave-a"></span>
      <span class="narration-wave wave-b"></span>
    </div>
  </main>

  <nav class="chrome" aria-label="Deck controls">
    <button class="icon-btn" id="prev" type="button" title="Previous slide" aria-label="Previous slide">‹</button>
    <div class="meter" aria-hidden="true"><span id="progress"></span></div>
    <button class="icon-btn" id="next" type="button" title="Next slide" aria-label="Next slide">›</button>
    <button class="icon-btn sound" id="sound" type="button" title="Replay narration" aria-label="Replay narration">◉</button>
  </nav>

  <form class="deck-chat" id="prompt-form" autocomplete="off">
    <output class="deck-chat-status" id="prompt-status" aria-live="polite"></output>
    <div class="deck-generation-console" id="generation-console" hidden>
      <div class="generation-console-head">
        <span>Realtime schema stream</span>
        <span id="generation-meta">idle</span>
      </div>
      <div class="generation-steps" id="generation-steps"></div>
      <pre id="generation-code" aria-live="polite"></pre>
    </div>
    <label class="sr-only" for="prompt-input">Slide prompt</label>
    <input id="prompt-input" name="prompt" type="text" inputmode="text" placeholder="Ask for a slide" maxlength="900">
    <button class="deck-chat-submit" id="prompt-submit" type="submit" aria-label="Generate slide">-&gt;</button>
  </form>

  <audio id="narrator" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
